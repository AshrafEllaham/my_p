<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — موقع الاستلام</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="uber-ui.css"></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮ ◔ ▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="15-account.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>موقع الاستلام</h1><span class="view-head-spacer"></span></header><p class="view-intro">اختر موقع الاستلام الأقرب لك ليظهر للمتجر عند تأكيد طلبك.</p><section class="view-card"><div class="location-banner"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><div><strong>موقعك الحالي</strong><small id="pickupSummary">القاهرة، مدينة نصر</small></div></div><button class="view-button secondary" id="detectLocation" type="button">استخدام موقعي الحالي</button><div class="view-field"><label class="view-label" for="pickupCity">المحافظة</label><select class="view-select" id="pickupCity"><option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option></select></div><div class="view-field"><label class="view-label" for="pickupAddress">العنوان التفصيلي</label><input class="view-input" id="pickupAddress" value="مدينة نصر، شارع عباس العقاد" type="text"></div><p class="view-message" id="pickupMessage" hidden></p><button class="view-button" id="savePickup" type="button">حفظ موقع الاستلام</button></section></main><script>const saved=JSON.parse(localStorage.getItem('saey_pickup_location')||'null'),city=document.getElementById('pickupCity'),address=document.getElementById('pickupAddress'),summary=document.getElementById('pickupSummary'),message=document.getElementById('pickupMessage');if(saved){city.value=saved.city;address.value=saved.address;summary.textContent=`${saved.city}، ${saved.address}`;}document.getElementById('detectLocation').onclick=event=>{const button=event.currentTarget;button.textContent='جارٍ تحديد الموقع…';if(!navigator.geolocation){button.textContent='تحديد الموقع غير متاح';return;}navigator.geolocation.getCurrentPosition(()=>{city.value='القاهرة';address.value='موقعك الحالي بالقرب من مدينة نصر';summary.textContent='تم تحديد موقعك الحالي';button.textContent='تم تحديد الموقع';},()=>button.textContent='تعذر الوصول للموقع');};document.getElementById('savePickup').onclick=()=>{if(address.value.trim().length<5){message.textContent='اكتب عنوانًا تفصيليًا صحيحًا.';message.className='view-message error';message.hidden=false;return;}localStorage.setItem('saey_pickup_location',JSON.stringify({city:city.value,address:address.value.trim(),date:new Date().toISOString()}));summary.textContent=`${city.value}، ${address.value.trim()}`;message.textContent='تم حفظ موقع الاستلام.';message.className='view-message success';message.hidden=false;};</script></body></html>
