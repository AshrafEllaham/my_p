<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 — إكمال الملف الشخصي | تطبيق سعي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="barq-auth-body">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">
    <div class="barq-topbar">
      <a class="barq-back-circle" href="04-account-type.html" aria-label="العودة">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </a>
      <span class="barq-step-badge">الخطوة 2 من 2</span>
    </div>

    <section class="barq-hero" style="margin-top: 8px; margin-bottom: 20px;">
      <h1>إكمال الملف الشخصي</h1>
      <p>أضف بياناتك الشخصية لتسهيل عمليات الشراء والاستلام</p>
    </section>

    <!-- Avatar Upload Section -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px;">
      <div style="position: relative;">
        <div id="userAvatarWrap" role="button" tabindex="0" aria-label="اختيار الصورة الشخصية" style="width: 92px; height: 92px; border-radius: 28px; background: #F1F5F9; border: 3px solid #FFFFFF; box-shadow: 0 8px 24px rgba(15,23,42,0.08); display: grid; place-items: center; color: #000000; overflow: hidden; cursor: pointer; background-size: cover; background-position: center;">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M20 21a8 8 0 0 0-16 0"/>
          </svg>
        </div>
        <input id="userImage" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <div style="position: absolute; bottom: -2px; left: -2px; width: 28px; height: 28px; border-radius: 50%; background: #000000; border: 2.5px solid #FFFFFF; color: #FFFFFF; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0, 0, 0,0.35); cursor: pointer;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #000000; cursor: pointer;">الصورة الشخصية مطلوبة</span>
    </div>

    <!-- Full Name Input -->
    <div class="barq-input-card">
      <label class="barq-input-label" for="fullName">الاسم الكامل <span style="color:#EF4444;">*</span></label>
      <div class="barq-input-inner">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M20 21a8 8 0 0 0-16 0"/>
          </svg>
        </div>
        <input id="fullName" type="text" placeholder="أدخل اسمك بالكامل">
      </div>
    </div>

    <!-- Address Input -->
    <div class="barq-input-card">
      <label class="barq-input-label" for="address">العنوان / المدينة</label>
      <div class="barq-input-inner">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <input id="address" type="text" placeholder="المدينة، الحي، الشارع">
      </div>
    </div>

    <p style="font-size: 11.5px; line-height: 1.6; color: #64748B; text-align: center; margin-top: 4px;">
      نستخدم هذه المعلومات لتأكيد الهوية وتسهيل استلام وتجهيز طلباتك.
    </p>

    <div style="margin-top: auto; margin-bottom: 20px;">
      <p class="auth-form-error" id="profileError" hidden></p>
      <button class="barq-btn-primary" id="saveProfileButton" type="button">بدء التسوق</button>
    </div>

  </main>

  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const userAvatarWrap = document.getElementById('userAvatarWrap');
    const userImage = document.getElementById('userImage');
    const saveProfileButton = document.getElementById('saveProfileButton');
    const profileError = document.getElementById('profileError');

    userAvatarWrap.addEventListener('click', () => userImage.click());
    userAvatarWrap.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        userImage.click();
      }
    });
    userImage.addEventListener('change', () => {
      const file = userImage.files[0];
      if (!file) return;
      userAvatarWrap.style.backgroundImage = `url('${URL.createObjectURL(file)}')`;
      userAvatarWrap.querySelector('svg').style.display = 'none';
    });

    saveProfileButton.addEventListener('click', async () => {
      const token = localStorage.getItem('saey_api_token');
      const name = document.getElementById('fullName').value.trim();
      const image = userImage.files[0];
      const address = document.getElementById('address').value.trim();

      if (!token || name.length < 2 || !image) {
        profileError.textContent = !token
          ? 'انتهت جلسة التسجيل. أعد إنشاء الحساب ثم حاول مرة أخرى.'
          : 'أدخل الاسم واختر الصورة الشخصية للمتابعة.';
        profileError.hidden = false;
        return;
      }

      const body = new FormData();
      body.append('name', name);
      body.append('image', image);
      if (address) body.append('address', address);

      profileError.hidden = true;
      saveProfileButton.disabled = true;
      saveProfileButton.textContent = 'جارٍ حفظ الملف…';

      try {
        const response = await fetch('http://127.0.0.1:8000/api/user/profile', {
          method: 'POST',
          headers: { 'Accept': 'application/json', 'Authorization': `Bearer ${token}` },
          body
        });
        const result = await response.json();
        if (!response.ok) {
          const firstError = Object.values(result.errors || {}).flat()[0];
          throw new Error(firstError || result.message || 'تعذر حفظ الملف الشخصي.');
        }
        location.href = '08-user-home.html';
      } catch (requestError) {
        profileError.textContent = requestError instanceof TypeError
          ? 'تعذر الاتصال بالخادم. تحقق من تشغيل API ثم أعد المحاولة.'
          : requestError.message;
        profileError.hidden = false;
        saveProfileButton.disabled = false;
        saveProfileButton.textContent = 'بدء التسوق';
      }
    });
  </script>

</body>
</html>
