<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>06 — إعداد ملف المتجر | تطبيق سعي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="barq-auth-body">

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">📶 🔋</div>
  </div>

  <main class="barq-page">

    <div class="barq-topbar" style="justify-content: flex-end;">
      <a class="barq-back-circle" href="04-account-type.html" title="العودة">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
    </div>

    <!-- Centered Barq Logo Mark -->
    <div class="barq-brand-centered">
      <span class="barq-brand-text">سعي</span>
      <div class="barq-brand-badge">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="white" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <section class="barq-hero">
      <h1>إعداد ملف المتجر</h1>
      <p>أكمل بيانات متجرك ليظهر للعملاء بشكل احترافي</p>
    </section>

    <div class="barq-input-card" style="padding:0; overflow:hidden; border-style:dashed;">
      <div style="height:104px; display:grid; place-items:center; background:#E0F2FE; color:#64748B; font-size:12px;">أضف غلاف المتجر</div>
    </div>
    <div style="display:flex; justify-content:center; margin-top:-42px;">
      <div style="width:76px;height:76px;border-radius:18px;background:#FFFFFF;border:1px solid #E2E8F0;display:grid;place-items:center;color:#2563EB;box-shadow:0 4px 12px rgba(15,23,42,.08);font-size:12px;">صورة<br>المتجر</div>
    </div>

    <!-- Store name -->
    <div class="barq-input-card">
      <label class="barq-input-label">اسم المتجر</label>
      <div class="barq-input-inner">
        <input type="text" placeholder="أدخل اسم المتجر">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M3 7v14M21 7v14M6 7V3h12v4M10 11v2M14 11v2M10 17v2M14 17v2"/></svg>
        </div>
      </div>
    </div>

    <div class="barq-input-card">
      <label class="barq-input-label">التصنيف الأساسي</label>
      <div class="barq-input-inner">
        <input type="text" placeholder="مثال: إلكترونيات">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        </div>
      </div>
    </div>

    <div class="barq-input-card">
      <label class="barq-input-label">وصف المتجر</label>
      <div class="barq-input-inner" style="height:66px; align-items:flex-start; padding-top:12px;">
        <textarea aria-label="وصف المتجر" placeholder="اكتب وصفًا مختصرًا للمتجر" style="width:100%;height:42px;border:0;outline:0;resize:none;background:transparent;color:#0F172A;font:600 13px var(--barq-font);"></textarea>
      </div>
    </div>

    <a class="barq-btn-primary" href="08-user-home.html" style="margin-top: 10px;">حفظ واستمرار</a>

  </main>

  <div class="home-bar"><div class="home-bar-pill"></div></div>

</body>
</html>
