<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — نزاعات الطلبات</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"><link rel="stylesheet" href="merchant-ui-states.css"></head><body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="20-distributor-account.html" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>نزاعات الطلبات</h1><p>حل المشكلات قبل إتمام الطلب</p></div><span></span></header><section class="ops-intro"><div><h2>طلبات تحتاج قرارًا</h2><p>راجع رسالة المستخدم والمحادثة ثم اختر إتمام الطلب، رد المبلغ، أو طلب معلومات.</p></div></section><section class="bo-list" id="disputesList"></section></main><div class="sheet-backdrop" id="disputeSheet" aria-hidden="true"><section class="ops-sheet" role="dialog" aria-modal="true"><div class="sheet-handle"></div><header class="ops-sheet-head"><h2>حسم النزاع</h2><button type="button" data-close aria-label="إغلاق">×</button></header><div class="decision-box"><span>الطلب</span><strong id="selectedOrder">—</strong></div><div class="mode-switch"><button class="active" data-resolution="more_info">طلب معلومات</button><button data-resolution="complete">اعتماد الإتمام</button><button data-resolution="refund">رد المبلغ</button></div><label class="form-field"><span>رسالة القرار</span><textarea class="sheet-note" id="resolutionNote" placeholder="اشرح القرار أو المعلومات المطلوبة"></textarea></label><p class="sheet-error" id="resolutionError"></p><button class="primary-action" id="saveResolution">حفظ وإشعار المستخدم</button></section></div><div class="ops-toast" id="toast"></div><script src="merchant-state.js"></script><script src="merchant-ui-states.js"></script><script>let selected='',resolution='more_info';const labels={open:'جديد',under_review:'قيد المراجعة',awaiting_customer:'بانتظار المستخدم',resolved:'تم الحسم'};function render(){const rows=SaeyMerchant.disputes();disputesList.innerHTML=rows.length?rows.map(item=>`<article class="bo-card ops-card"><div class="bo-card-head"><div><strong class="bo-card-code">#${item.order}</strong><time class="bo-card-time">${item.date?new Date(item.date).toLocaleDateString('ar-EG'):'اليوم'}</time></div><span class="bo-status ${item.status}">${labels[item.status]||item.status}</span></div><div class="bo-reason"><svg class="ops-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 17h.01"/></svg><span><b>بلاغ المستخدم</b>${item.note}</span></div>${item.customerResponse?`<div class="bo-reason"><span><b>رد المستخدم</b>${item.customerResponse}</span></div>`:''}${item.status!=='resolved'?`<div class="bo-actions"><button class="bo-primary" data-open="${item.id}">اتخاذ قرار</button><a class="bo-secondary" href="14-chat-conversation.html">فتح المحادثة</a></div>`:''}</article>`).join(''):'<div class="empty-state ops-card"><h3>لا توجد نزاعات مفتوحة</h3><p>ستظهر هنا المشكلات التي يوقف المستخدم بسببها إتمام الطلب.</p></div>';document.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>openSheet(button.dataset.open))}function openSheet(id){selected=id;resolution='more_info';const item=SaeyMerchant.disputes().find(entry=>entry.id===id);selectedOrder.textContent=`#${item?.order||''}`;resolutionNote.value='';disputeSheet.querySelectorAll('[data-resolution]').forEach((button,index)=>button.classList.toggle('active',index===0));disputeSheet.classList.add('visible');disputeSheet.setAttribute('aria-hidden','false')}function closeSheet(){disputeSheet.classList.remove('visible');disputeSheet.setAttribute('aria-hidden','true')}disputeSheet.querySelector('[data-close]').onclick=closeSheet;disputeSheet.querySelectorAll('[data-resolution]').forEach(button=>button.onclick=()=>{resolution=button.dataset.resolution;disputeSheet.querySelectorAll('[data-resolution]').forEach(item=>item.classList.toggle('active',item===button))});saveResolution.onclick=async()=>{const note=resolutionNote.value.trim();if(note.length<8){resolutionError.textContent='اكتب رسالة واضحة من ٨ أحرف على الأقل.';return}const accepted=await SaeyUI.confirm({title:'تأكيد قرار النزاع؟',message:resolution==='refund'?'سيتم رد المبلغ للمستخدم وإغلاق الطلب.':resolution==='complete'?'سيتم اعتماد إتمام الطلب وتحويل مستحقات المتجر.':'سيُطلب من المستخدم إضافة معلومات جديدة.',confirmLabel:'تأكيد القرار',danger:resolution==='refund'});if(!accepted)return;SaeyMerchant.resolveDispute(selected,resolution,note);closeSheet();render();SaeyUI.success('تم حفظ القرار وإشعار المستخدم')};render();</script></body></html>
