<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — حالة تفعيل المتجر</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="uber-ui.css"><style>.activation-state{text-align:center}.activation-state svg{width:48px;height:48px;padding:12px;border-radius:16px;background:#F2F2F2;fill:none;stroke:#0F172A;stroke-width:1.8}.activation-state h2{margin:12px 0 4px}.activation-state p{margin:0;color:#64748B;font-size:12px;line-height:1.7}.activation-meta{margin-top:14px;text-align:right}.activation-retry{margin-top:14px}.activation-retry input{box-sizing:border-box;width:100%;height:48px;padding:10px;border:1px solid #E1E8F1;border-radius:10px}</style></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="20-distributor-account.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>تفعيل المتجر</h1><span></span></header><section class="view-card activation-state"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/></svg><h2 id="stateTitle">قيد المراجعة</h2><p id="stateDescription">نراجع بيانات النشاط وحساب التسوية. سنرسل لك إشعارًا فور صدور القرار.</p><div class="activation-meta"><div class="view-field"><span class="view-label">تاريخ الإرسال</span><strong id="submittedAt">—</strong></div><div class="view-field"><span class="view-label">حساب التسوية</span><strong id="ibanSummary" dir="ltr">—</strong></div></div></section><section class="view-card activation-retry" id="retryCard" hidden><h2 class="view-card-title">إعادة إرسال المستند</h2><p class="view-intro" id="rejectionReason">راجع سبب الرفض ثم ارفع مستندًا صحيحًا.</p><input id="replacementDocument" type="file" accept="image/png,image/jpeg,application/pdf"><p class="view-message" id="retryError" hidden></p><button class="view-button" id="resubmitActivation" type="button">إعادة الإرسال للمراجعة</button></section></main><script>const key='saey_merchant_activation_v1',params=new URLSearchParams(location.search),saved=JSON.parse(localStorage.getItem(key)||'null')||{status:'pending_review',submittedAt:new Date().toISOString(),ibanLast4:'—'},forced=params.get('state');if(['approved','rejected','pending_review'].includes(forced)){saved.status=forced;if(forced==='rejected'&&!saved.rejectionReason)saved.rejectionReason='المستند المرفوع غير واضح أو لا يطابق بيانات النشاط.';localStorage.setItem(key,JSON.stringify(saved))}const states={pending_review:['قيد المراجعة','نراجع بيانات النشاط وحساب التسوية. سنرسل لك إشعارًا فور صدور القرار.'],approved:['تم تفعيل المتجر','يمكنك الآن استقبال الطلبات المدفوعة وطلب التسويات.'],rejected:['مطلوب تعديل البيانات','تعذر اعتماد المستند الحالي. راجع السبب وأعد الإرسال.']},state=states[saved.status]||states.pending_review;stateTitle.textContent=state[0];stateDescription.textContent=state[1];submittedAt.textContent=new Date(saved.submittedAt||Date.now()).toLocaleDateString('ar-EG');ibanSummary.textContent=saved.ibanLast4==='—'?'غير مسجل':`EG •••• ${saved.ibanLast4}`;if(saved.status==='rejected'){retryCard.hidden=false;rejectionReason.textContent=saved.rejectionReason||rejectionReason.textContent;resubmitActivation.onclick=()=>{const file=replacementDocument.files[0];if(!file){retryError.textContent='اختر مستندًا جديدًا أولًا.';retryError.className='view-message error';retryError.hidden=false;return}saved.status='pending_review';saved.documentName=file.name;saved.submittedAt=new Date().toISOString();delete saved.rejectionReason;localStorage.setItem(key,JSON.stringify(saved));location.reload()}}</script></body></html>
