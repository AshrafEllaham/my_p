<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>سعي — الإعلان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sponsored-reel.css">
</head>
<body class="sponsored-reel">
  <main class="reel-viewer" id="reelViewer" aria-label="عرض الإعلان بملء الشاشة">
    <img class="reel-media" id="reelMedia" alt="">
    <div class="reel-shade"></div>
    <div class="reel-progress" id="reelProgress" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="reel-header">
      <button class="reel-circle" id="closeReel" type="button" aria-label="إغلاق الإعلان"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <span><b>إعلان</b> ممول</span>
    </header>
    <aside class="reel-tools" aria-label="أدوات الإعلان">
      <button id="likeReel" type="button" aria-label="إعجاب"><svg viewBox="0 0 24 24"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg><small>إعجاب</small></button>
      <button id="shareReel" type="button" aria-label="مشاركة الإعلان"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.1M8.7 13.3l6.6 4.1"/></svg><small>مشاركة</small></button>
      <button id="toggleReel" type="button" aria-label="إيقاف مؤقت"><svg class="pause-icon" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg><svg class="play-icon" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></svg><small id="playLabel">إيقاف</small></button>
      <button id="nextReel" type="button" aria-label="الإعلان التالي"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><small>التالي</small></button>
    </aside>
    <section class="reel-content">
      <a class="reel-store" id="reelStore" href="19-store-details.html"><span class="reel-avatar" id="reelAvatar">ت</span><span><strong id="reelStoreName">التقنية الحديثة</strong><small>متجر موثّق</small></span></a>
      <h1 id="reelTitle">خصم حتى ٢٠٪ على أحدث الإلكترونيات</h1>
      <p id="reelDescription">اكتشف العرض وتسوق مباشرة من المتجر.</p>
      <div class="reel-actions"><a class="reel-primary" id="reelCta" href="19-store-details.html" aria-label="تسوّق الآن" title="تسوّق الآن"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H7"/></svg></a><a class="reel-secondary" id="reelChat" href="14-chat-conversation.html" aria-label="دردشة" title="دردشة"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 11h8M8 15h5"/></svg></a></div>
    </section>
    <p class="reel-hint">اسحب لأعلى للإعلان التالي</p>
  </main>
  <script src="sponsored-reel.js"></script>
</body>
</html>
