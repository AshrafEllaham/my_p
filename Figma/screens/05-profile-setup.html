<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 — تحديد الموقع | تطبيق سعي للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    .barq-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: 0;
      background: #FFFFFF;
      border: 1px solid var(--barq-line);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      z-index: 50;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .barq-dropdown-menu.open {
      display: block;
    }
    .barq-dropdown-item {
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--barq-ink);
      cursor: pointer;
      transition: background 0.15s;
    }
    .barq-dropdown-item:hover {
      background: var(--barq-blue-soft);
      color: var(--barq-blue);
    }
    .barq-select-box[aria-disabled="true"] {
      background: #F8FAFC;
      color: var(--barq-light);
      cursor: not-allowed;
    }
    .barq-select-box[aria-disabled="true"] .barq-select-chevron {
      opacity: .55;
    }
  </style>
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="barq-auth-body">

  <!-- Status Bar & Dynamic Island -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">

    <!-- Centered Brand Logo Mark -->
    <div class="barq-brand-centered">
      <div class="barq-brand-badge">
        <svg viewBox="0 0 64 64" fill="none" style="width: 24px; height: 24px;">
          <path d="M16.5 42c5.1 0 7.3-5.2 10.5-10.4 3.1-5 5.8-9.3 10.5-9.3 5 0 8.1 3.9 12 9.6" stroke="#FFF" stroke-width="5.25" stroke-linecap="round"/>
          <path d="m44.7 25.7 5.5 6.6-8 .6" stroke="#FFF" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.5" cy="42" r="2.55" fill="#FFF"/>
        </svg>
      </div>
      <span class="barq-brand-text">سعي</span>
    </div>

    <!-- Screen Title & Subtitle -->
    <section class="barq-hero">
      <h1>تحديد الموقع</h1>
      <p>اختر الدولة والمحافظة لتخصيص تجربتك</p>
    </section>

    <!-- Country Selector Card -->
    <div class="barq-select-card" style="position: relative;">
      <label class="barq-input-label">الدولة</label>
      <div class="barq-select-box" id="countryBox" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="countryMenu">
        <div class="barq-select-value placeholder" id="countryValue">جارٍ تحميل الدول…</div>
        <div class="barq-select-chevron">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="barq-dropdown-menu" id="countryMenu" role="listbox" aria-label="الدول"></div>
    </div>

    <!-- Governorate Selector Card -->
    <div class="barq-select-card" style="position: relative;">
      <label class="barq-input-label">المحافظة</label>
      <div class="barq-select-box" id="govBox" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="govMenu" aria-disabled="true">
        <div class="barq-select-value placeholder" id="govValue">اختر المحافظة</div>
        <div class="barq-select-chevron">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="barq-dropdown-menu" id="govMenu" role="listbox" aria-label="المحافظات"></div>
    </div>

    <!-- City Selector Card -->
    <div class="barq-select-card" style="position: relative;">
      <label class="barq-input-label" for="cityBox">المدينة</label>
      <div class="barq-select-box" id="cityBox" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="cityMenu" aria-disabled="true">
        <div class="barq-select-value placeholder" id="cityValue">اختر المدينة</div>
        <div class="barq-select-chevron">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="barq-dropdown-menu" id="cityMenu" role="listbox" aria-label="المدن">
      </div>
    </div>

    <!-- Actions Area -->
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px;">
      <!-- Primary Button: متابعة -->
      <button class="barq-btn-primary" id="saveLocationButton" type="button">متابعة</button>

      <!-- Divider: أو -->
      <div class="barq-divider">أو</div>

      <!-- Secondary Button: تخطي الآن -->
      <button class="barq-btn-secondary" id="skipLocationButton" type="button">تخطي الآن</button>
    </div>
    <p class="auth-form-error" id="locationError" hidden></p>

  </main>

  <!-- iOS Home Bar -->
  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const apiBaseUrl = 'http://127.0.0.1:8000/api';
    const countryBox = document.getElementById('countryBox');
    const countryMenu = document.getElementById('countryMenu');
    const countryValue = document.getElementById('countryValue');
    const govBox = document.getElementById('govBox');
    const govMenu = document.getElementById('govMenu');
    const govValue = document.getElementById('govValue');
    const cityBox = document.getElementById('cityBox');
    const cityMenu = document.getElementById('cityMenu');
    const cityValue = document.getElementById('cityValue');
    let selectedCountryId = null;
    let selectedGovernorateId = null;
    let selectedCityId = null;

    const listData = async path => {
      const response = await fetch(`${apiBaseUrl}/${path}`, {
        headers: { Accept: 'application/json', 'Accept-Language': 'ar' }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'تعذر تحميل بيانات الموقع.');
      return result.data || [];
    };
    const createOption = (item, label, key) => {
      const option = document.createElement('div');
      option.className = 'barq-dropdown-item';
      option.setAttribute('role', 'option');
      option.tabIndex = 0;
      option.dataset[key] = item.id;
      option.textContent = label;
      return option;
    };
    const closeMenus = () => {
      [countryMenu, govMenu, cityMenu].forEach(menu => menu.classList.remove('open'));
      [countryBox, govBox, cityBox].forEach(box => box.setAttribute('aria-expanded', 'false'));
    };
    const setOptions = (menu, items, label, key) => {
      menu.replaceChildren(...items.map(item => createOption(item, label(item), key)));
    };
    const setPlaceholder = (element, text) => {
      element.textContent = text;
      element.classList.add('placeholder');
    };

    const toggleMenu = (box, menu) => {
      if (box.getAttribute('aria-disabled') === 'true') return;
      const shouldOpen = !menu.classList.contains('open');
      closeMenus();
      menu.classList.toggle('open', shouldOpen);
      box.setAttribute('aria-expanded', String(shouldOpen));
    };
    const bindDropdown = (box, menu) => {
      box.addEventListener('click', event => {
        event.stopPropagation();
        toggleMenu(box, menu);
      });
      box.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleMenu(box, menu);
        }
      });
      menu.addEventListener('keydown', event => {
        const option = event.target.closest('[role="option"]');
        if (option && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          option.click();
        }
      });
    };
    bindDropdown(countryBox, countryMenu);
    bindDropdown(govBox, govMenu);
    bindDropdown(cityBox, cityMenu);
    countryMenu.addEventListener('click', async event => {
      const item = event.target.closest('[data-country-id]');
      if (!item) return;
      selectedCountryId = Number(item.dataset.countryId);
      selectedGovernorateId = null;
      selectedCityId = null;
      countryValue.textContent = item.textContent;
      countryValue.classList.remove('placeholder');
      setPlaceholder(govValue, 'اختر المحافظة');
      setPlaceholder(cityValue, 'اختر المدينة');
      govBox.setAttribute('aria-disabled', 'false');
      cityBox.setAttribute('aria-disabled', 'true');
      cityMenu.replaceChildren();
      closeMenus();
      try {
        const governorates = await listData(`governorates?country_id=${selectedCountryId}`);
        setOptions(govMenu, governorates, option => option.name, 'governorateId');
      } catch (error) {
        document.getElementById('locationError').textContent = error.message;
        document.getElementById('locationError').hidden = false;
      }
    });
    govMenu.addEventListener('click', event => {
      const item = event.target.closest('[data-governorate-id]');
      if (item) {
        selectedGovernorateId = Number(item.dataset.governorateId);
        selectedCityId = null;
        govValue.textContent = item.textContent;
        govValue.classList.remove('placeholder');
        setPlaceholder(cityValue, 'اختر المدينة');
        cityBox.setAttribute('aria-disabled', 'false');
        closeMenus();
        listData(`cities?governorate_id=${selectedGovernorateId}`).then(cities => {
          setOptions(cityMenu, cities, option => option.name, 'cityId');
        }).catch(error => {
          document.getElementById('locationError').textContent = error.message;
          document.getElementById('locationError').hidden = false;
        });
      }
    });
    cityMenu.addEventListener('click', event => {
      const item = event.target.closest('[data-city-id]');
      if (!item) return;
      selectedCityId = Number(item.dataset.cityId);
      cityValue.textContent = item.textContent;
      cityValue.classList.remove('placeholder');
      closeMenus();
    });

    document.addEventListener('click', (e) => {
      if (!countryBox.contains(e.target) && !countryMenu.contains(e.target)) countryMenu.classList.remove('open');
      if (!govBox.contains(e.target) && !govMenu.contains(e.target)) govMenu.classList.remove('open');
      if (!cityBox.contains(e.target) && !cityMenu.contains(e.target)) cityMenu.classList.remove('open');
      countryBox.setAttribute('aria-expanded', 'false');
      govBox.setAttribute('aria-expanded', 'false');
      cityBox.setAttribute('aria-expanded', 'false');
    });

    listData('countries').then(countries => {
      setOptions(countryMenu, countries, country => [country.flag, country.name].filter(Boolean).join(' '), 'countryId');
      const defaultCountry = countries.find(country => country.code === 'EG' || country.phone_code === '+20') || countries[0];
      if (defaultCountry) countryMenu.querySelector(`[data-country-id="${defaultCountry.id}"]`)?.click();
    }).catch(error => {
      const locationError = document.getElementById('locationError');
      locationError.textContent = error.message;
      locationError.hidden = false;
    });

    const saveLocation = async skipLocation => {
      const signupDraft = JSON.parse(sessionStorage.getItem('saey_signup_draft') || 'null');
      const error = document.getElementById('locationError');
      const buttons = [document.getElementById('saveLocationButton'), document.getElementById('skipLocationButton')];
      if (!signupDraft?.userId || !signupDraft?.accountType) {
        location.href = '04-account-type.html';
        return;
      }

      error.hidden = true;
      buttons.forEach(button => { button.disabled = true; });
      try {
        const locationData = skipLocation ? {} : {
          ...(selectedCountryId ? { country_id: selectedCountryId } : {}),
          ...(selectedGovernorateId ? { governorate_id: selectedGovernorateId } : {}),
          ...(selectedCityId ? { city_id: selectedCityId } : {})
        };
        const response = await fetch(`http://127.0.0.1:8000/api/accounts/${signupDraft.userId}/type`, {
          method: 'PATCH',
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ account_type: signupDraft.accountType, ...locationData })
        });
        const result = await response.json();
        if (!response.ok) {
          const firstError = Object.values(result.errors || {}).flat()[0];
          throw new Error(firstError || result.message || 'تعذر حفظ الموقع. حاول مرة أخرى.');
        }

        sessionStorage.removeItem('saey_onboarding_location');
        const nextPage = signupDraft.name
          ? signupDraft.accountType === 'store' ? '17-distributor-dashboard.html' : '08-user-home.html'
          : signupDraft.accountType === 'store' ? '06-distributor-setup.html' : '08-profile-setup.html';
        location.href = nextPage;
      } catch (requestError) {
        error.textContent = requestError instanceof TypeError
          ? 'تعذر الاتصال بالخادم. تحقق من تشغيل API ثم أعد المحاولة.'
          : requestError.message;
        error.hidden = false;
        buttons.forEach(button => { button.disabled = false; });
      }
    };
    document.getElementById('saveLocationButton').addEventListener('click', () => saveLocation(false));
    document.getElementById('skipLocationButton').addEventListener('click', () => saveLocation(true));
  </script>
</body>
</html>
