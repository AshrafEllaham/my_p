<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 — تحديد الموقع | تطبيق سعي للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    .barq-dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      left: 0;
      background: #FFFFFF;
      border: 1px solid var(--barq-line);
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      z-index: 50;
      max-height: 180px;
      overflow-y: auto;
      display: none;
    }
    .barq-dropdown-menu.open {
      display: block;
    }
    .barq-dropdown-item {
      padding: 12px 16px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--barq-ink);
      cursor: pointer;
      transition: background 0.15s;
    }
    .barq-dropdown-item:hover {
      background: var(--barq-blue-soft);
      color: var(--barq-blue);
    }
  </style>
</head>
<body class="barq-auth-body">

  <!-- Status Bar & Dynamic Island -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">

    <!-- Centered Brand Logo Mark -->
    <div class="barq-brand-centered">
      <div class="barq-brand-badge">
        <svg viewBox="0 0 64 64" fill="none" style="width: 24px; height: 24px;">
          <path d="M16.5 42c5.1 0 7.3-5.2 10.5-10.4 3.1-5 5.8-9.3 10.5-9.3 5 0 8.1 3.9 12 9.6" stroke="#FFF" stroke-width="5.25" stroke-linecap="round"/>
          <path d="m44.7 25.7 5.5 6.6-8 .6" stroke="#FFF" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.5" cy="42" r="2.55" fill="#FFF"/>
        </svg>
      </div>
      <span class="barq-brand-text">سعي</span>
    </div>

    <!-- Screen Title & Subtitle -->
    <section class="barq-hero">
      <h1>تحديد الموقع</h1>
      <p>اختر الدولة والمحافظة لتخصيص تجربتك</p>
    </section>

    <!-- Country Selector Card -->
    <div class="barq-select-card">
      <label class="barq-input-label">الدولة</label>
      <div class="barq-select-box" id="countryBox">
        <div class="barq-select-value">
          <span style="font-size: 20px;">🇪🇬</span>
          <span>مصر</span>
        </div>
        <div class="barq-select-chevron">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
    </div>

    <!-- Governorate Selector Card -->
    <div class="barq-select-card" style="position: relative;">
      <label class="barq-input-label">المحافظة</label>
      <div class="barq-select-box" id="govBox">
        <div class="barq-select-value placeholder" id="govValue">اختر المحافظة</div>
        <div class="barq-select-chevron">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="barq-dropdown-menu" id="govMenu">
        <div class="barq-dropdown-item" data-gov="القاهرة">القاهرة</div>
        <div class="barq-dropdown-item" data-gov="الجيزة">الجيزة</div>
        <div class="barq-dropdown-item" data-gov="الإسكندرية">الإسكندرية</div>
        <div class="barq-dropdown-item" data-gov="الشرقية">الشرقية</div>
        <div class="barq-dropdown-item" data-gov="الدقهلية">الدقهلية</div>
        <div class="barq-dropdown-item" data-gov="القليوبية">القليوبية</div>
        <div class="barq-dropdown-item" data-gov="البحيرة">البحيرة</div>
      </div>
    </div>

    <!-- Actions Area -->
    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 14px;">
      <!-- Primary Button: متابعة -->
      <a class="barq-btn-primary" href="04-account-type.html">متابعة</a>

      <!-- Divider: أو -->
      <div class="barq-divider">أو</div>

      <!-- Secondary Button: تخطي الآن -->
      <a class="barq-btn-secondary" href="04-account-type.html">تخطي الآن</a>
    </div>

  </main>

  <!-- iOS Home Bar -->
  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const govBox = document.getElementById('govBox');
    const govMenu = document.getElementById('govMenu');
    const govValue = document.getElementById('govValue');

    govBox.addEventListener('click', (e) => {
      e.stopPropagation();
      govMenu.classList.toggle('open');
    });

    document.querySelectorAll('.barq-dropdown-item').forEach(item => {
      item.addEventListener('click', () => {
        const gov = item.dataset.gov;
        govValue.textContent = gov;
        govValue.classList.remove('placeholder');
        govMenu.classList.remove('open');
      });
    });

    document.addEventListener('click', (e) => {
      if (!govBox.contains(e.target) && !govMenu.contains(e.target)) {
        govMenu.classList.remove('open');
      }
    });
  </script>
</body>
</html>
