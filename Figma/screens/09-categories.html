<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سعي — كل الأقسام</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="saey-catalog">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>
  <main class="catalog-page">
    <header class="catalog-header">
      <a class="catalog-back" id="catalogBack" href="08-user-home.html" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <h1>كل الأقسام</h1>
      <span></span>
    </header>
    <label class="catalog-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="categorySearch" type="search" placeholder="ابحث في الأقسام" aria-label="ابحث في الأقسام">
    </label>
    <p class="catalog-subtitle" id="catalogSubtitle">اختر القسم الذي يناسب احتياجك</p>
    <p class="catalog-subtitle" id="catalogMessage" role="status" aria-live="polite" hidden></p>
    <section class="catalog-grid" id="catalogGrid" aria-live="polite"></section>
    <button class="catalog-more" id="catalogMore" type="button" hidden>عرض المزيد</button>
  </main>
  <nav class="saey-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="08-user-home.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-9h6v9"/></svg></span><span>الرئيسية</span></a>
    <a class="active" href="09-categories.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>الأقسام</span></a>
    <a href="16-orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/></svg></span><span>الطلبات</span></a>
    <a href="15-account.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span>حسابي</span></a>
  </nav>
  <script>
    const catalogApiOrigin = location.protocol === 'file:'
      ? 'http://127.0.0.1:8000'
      : location.hostname === 'localhost' || location.hostname === '127.0.0.1'
        ? `${location.protocol}//${location.hostname}:8000`
        : location.origin;
    const catalogApiBase = new URL('/api', catalogApiOrigin).toString().replace(/\/$/, '');
    const categorySearch = document.getElementById('categorySearch');
    const catalogGrid = document.getElementById('catalogGrid');
    const catalogMessage = document.getElementById('catalogMessage');
    const catalogMore = document.getElementById('catalogMore');
    let mainCategories = [];
    let page = 1;
    let lastPage = 1;
    let loading = false;
    let searchTimer = null;
    let controller = null;
    let requestId = 0;
    let retryLoad = false;

    const categoryIcon = () => {
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('fill', 'none');
      icon.setAttribute('stroke', 'currentColor');
      icon.setAttribute('stroke-width', '1.8');
      icon.setAttribute('stroke-linecap', 'round');
      icon.setAttribute('stroke-linejoin', 'round');
      [['3','3'],['14','3'],['3','14'],['14','14']].forEach(([x,y]) => {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x);
        rect.setAttribute('y', y);
        rect.setAttribute('width', '7');
        rect.setAttribute('height', '7');
        rect.setAttribute('rx', '1.5');
        icon.append(rect);
      });
      return icon;
    };
    const renderCategory = category => {
      const link = document.createElement('a');
      link.className = 'catalog-category';
      link.href = `24-category-details.html?category=${encodeURIComponent(category.name || '')}&category_id=${encodeURIComponent(category.id)}`;
      link.dataset.categoryId = category.id;
      const icon = document.createElement('span');
      icon.className = 'catalog-category-icon';
      if (category.image) {
        const image = document.createElement('img');
        image.src = category.image;
        image.alt = '';
        icon.append(image);
      } else {
        icon.append(categoryIcon());
      }
      const name = document.createElement('span');
      name.className = 'catalog-category-name';
      name.textContent = category.name || '';
      const hint = document.createElement('small');
      hint.textContent = 'عرض المنتجات';
      link.append(icon, name, hint);
      catalogGrid.append(link);
    };
    const showMessage = message => {
      catalogMessage.textContent = message;
      catalogMessage.hidden = !message;
    };
    const request = async (path, signal) => {
      const response = await fetch(`${catalogApiBase}/${path}`, {
        signal,
        headers: { Accept: 'application/json', 'Accept-Language': 'ar' }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'تعذر تحميل الأقسام.');
      return result;
    };
    const loadMainCategories = async (replace = false) => {
      if (loading) return;
      if (replace) {
        page = 1;
        lastPage = 1;
        catalogGrid.replaceChildren();
      }
      const currentPage = page;
      const currentRequestId = ++requestId;
      const requestController = new AbortController();
      controller = requestController;
      loading = true;
      retryLoad = false;
      catalogMore.disabled = true;
      catalogMore.textContent = 'عرض المزيد';
      catalogMore.hidden = true;
      showMessage('جارٍ تحميل الأقسام…');
      try {
        const params = new URLSearchParams({
          pagination: 'on',
          limit_per_page: '8',
          page: String(currentPage)
        });
        const query = categorySearch.value.trim();
        if (query) params.set('search', query);
        const result = await request(`user/main-categories?${params}`, requestController.signal);
        if (currentRequestId !== requestId) return;
        const categories = result.data || [];
        mainCategories = currentPage === 1 ? categories : [...mainCategories, ...categories];
        categories.forEach(renderCategory);
        page = Number(result.current_page || currentPage) + 1;
        lastPage = Number(result.last_page || 1);
        showMessage(mainCategories.length ? '' : 'لا توجد أقسام تطابق البحث.');
        catalogMore.hidden = page > lastPage;
      } catch (error) {
        if (requestController.signal.aborted || currentRequestId !== requestId) return;
        retryLoad = true;
        showMessage(error.message || 'تعذر تحميل الأقسام.');
        catalogMore.textContent = 'إعادة المحاولة';
        catalogMore.hidden = false;
      } finally {
        if (currentRequestId === requestId) {
          loading = false;
          controller = null;
          catalogMore.disabled = false;
        }
      }
    };
    catalogGrid.addEventListener('click', event => {
      const link = event.target.closest('[data-category-id]');
      if (!link) return;
      event.preventDefault();
      const category = mainCategories.find(item => String(item.id) === link.dataset.categoryId);
      if (!category) return;
      location.href = `24-category-details.html?category=${encodeURIComponent(category.name || '')}&category_id=${encodeURIComponent(category.id)}&main_category_id=${encodeURIComponent(category.id)}`;
    });
    catalogMore.addEventListener('click', () => loadMainCategories(retryLoad));
    categorySearch.addEventListener('input', () => {
      clearTimeout(searchTimer);
      requestId++;
      if (controller) controller.abort();
      controller = null;
      loading = false;
      page = 1;
      mainCategories = [];
      catalogGrid.replaceChildren();
      catalogMore.hidden = true;
      searchTimer = setTimeout(() => loadMainCategories(true), 250);
    });

    showMessage('جارٍ تحميل الأقسام…');
    loadMainCategories(true);
  </script>
</body>
</html>
