  <nav class="saey-bottom-nav" aria-label="التنقل الرئيسي">

    <a href="15-account.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span>حسابي</span></a>
  </nav>
  <script>
    const catalogApiBase = 'http://127.0.0.1:8000/api';
    const categorySearch = document.getElementById('categorySearch');
    const catalogGrid = document.getElementById('catalogGrid');
    const catalogTitle = document.querySelector('.catalog-header h1');
    const catalogSubtitle = document.getElementById('catalogSubtitle');
    const catalogMessage = document.getElementById('catalogMessage');
    const catalogBack = document.getElementById('catalogBack');
    let mainCategories = [];
    let visibleCategories = [];
    let selectedMainCategory = null;

    const fetchCategories = async path => {
      const response = await fetch(`${catalogApiBase}/${path}`, {
        headers: { Accept: 'application/json', 'Accept-Language': 'ar' }
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.message || 'تعذر تحميل الأقسام.');
      return result.data || [];
    };
    const categoryIcon = () => {
      const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      icon.setAttribute('viewBox', '0 0 24 24');
      icon.setAttribute('fill', 'none');
      icon.setAttribute('stroke', 'currentColor');
      icon.setAttribute('stroke-width', '1.9');
      icon.setAttribute('stroke-linecap', 'round');
      icon.setAttribute('stroke-linejoin', 'round');
      [['3','3'],['14','3'],['3','14'],['14','14']].forEach(([x,y]) => {
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x); rect.setAttribute('y', y);
        rect.setAttribute('width', '7'); rect.setAttribute('height', '7'); rect.setAttribute('rx', '1.5');
        icon.append(rect);
      });
      return icon;
    };
    const renderCategories = () => {
      const query = categorySearch.value.trim().toLocaleLowerCase();
      const items = visibleCategories.filter(category => !query || category.name?.toLocaleLowerCase().includes(query));
      catalogGrid.replaceChildren(...items.map(category => {
        const link = document.createElement('a');
        link.className = 'catalog-category';
        link.href = `24-category-details.html?category=${encodeURIComponent(category.name || '')}&category_id=${encodeURIComponent(category.id)}`;
        link.dataset.categoryId = category.id;
        const icon = document.createElement('span');
        icon.className = 'catalog-category-icon';
        if (category.image) {
          const image = document.createElement('img');
          image.src = category.image;
          image.alt = '';
          icon.append(image);
        } else {
          icon.append(categoryIcon());
        }
        const name = document.createTextNode(category.name || '');
        const hint = document.createElement('small');
        hint.textContent = selectedMainCategory ? 'عرض المنتجات' : 'عرض الأقسام';
        link.append(icon, name, hint);
        return link;
      }));
    };
    const showMainCategories = () => {
      selectedMainCategory = null;
      visibleCategories = mainCategories;
      catalogTitle.textContent = 'كل الأقسام';
      catalogSubtitle.textContent = 'اختر القسم الذي يناسب احتياجك';
      catalogBack.href = '08-user-home.html';
      catalogBack.setAttribute('aria-label', 'رجوع للرئيسية');
      catalogMessage.hidden = true;
      renderCategories();
    };
    const showSubCategories = async category => {
      catalogMessage.hidden = false;
      catalogMessage.textContent = 'جارٍ تحميل الأقسام الفرعية…';
      try {
        const children = await fetchCategories(`sub-categories?main_category_id=${encodeURIComponent(category.id)}`);
        if (!children.length) {
          location.href = `24-category-details.html?category=${encodeURIComponent(category.name || '')}&category_id=${encodeURIComponent(category.id)}`;
          return;
        }
        selectedMainCategory = category;
        visibleCategories = children;
        catalogTitle.textContent = category.name;
        catalogSubtitle.textContent = 'اختر قسمًا فرعيًا';
        catalogBack.href = '#';
        catalogBack.setAttribute('aria-label', 'العودة إلى الأقسام الرئيسية');
        catalogMessage.hidden = true;
        categorySearch.value = '';
        renderCategories();
      } catch (error) {
        catalogMessage.textContent = error.message;
      }
    };
    catalogGrid.addEventListener('click', event => {
      const link = event.target.closest('[data-category-id]');
      if (!link) return;
      event.preventDefault();
      const category = visibleCategories.find(item => String(item.id) === link.dataset.categoryId);
      if (!category) return;
      if (selectedMainCategory) {
        location.href = link.href;
      } else {
        showSubCategories(category);
      }
    });
    catalogBack.addEventListener('click', event => {
      if (!selectedMainCategory) return;
      event.preventDefault();
      showMainCategories();
    });
    categorySearch.addEventListener('input', renderCategories);
    catalogGrid.replaceChildren();
    catalogMessage.textContent = 'جارٍ تحميل الأقسام…';
    catalogMessage.hidden = false;
    fetchCategories('main-categories').then(categories => {
      mainCategories = categories;
      showMainCategories();
    }).catch(error => {
      catalogMessage.textContent = error.message;
      catalogMessage.hidden = false;
    });
  </script>
</body>
</html>
