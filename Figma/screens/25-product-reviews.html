<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>سعي — تقييمات المنتج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="user-flows.css">
  <link rel="stylesheet" href="user-experience.css">
  <style>
    .saey-flow [hidden]{display:none!important}
    .reviews-summary{text-align:center}.reviews-summary strong{display:block;font-size:34px}.reviews-summary span{color:#F59E0B;font-size:18px}
    .reviews-summary p{color:#64748B;font-size:12px}
    .reviews-filter{display:flex;align-items:center;gap:12px;margin:16px 0;padding:10px 12px;border:1px solid #E1E8F1;border-radius:12px;background:#FFF;font:800 12px 'Inter','Cairo',sans-serif}
    .reviews-filter select{flex:1;min-width:0;border:0;background:transparent;font:700 14px 'Inter','Cairo',sans-serif}
    .review-item{margin-bottom:9px;padding:12px;border:1px solid #E1E8F1;border-radius:12px;background:#FFF}
    .review-item header{display:flex;justify-content:space-between;gap:8px}.review-item strong{font-size:12px}.review-item b{color:#B45309;font-size:11px}
    .review-item p{margin:6px 0;color:#475569;font-size:12px;line-height:1.7}.review-item time{color:#64748B;font-size:11px}
    .review-status{text-align:center;padding:24px 12px;color:#64748B;font:700 12px 'Inter','Cairo',sans-serif}
    .review-action{width:100%;height:48px;margin:12px 0;border:1px solid #E1E8F1;border-radius:10px;background:#FFF;color:#0F172A;font:800 14px 'Inter','Cairo',sans-serif}
    .review-action:focus-visible,.reviews-filter select:focus-visible{outline:2px solid #000;outline-offset:2px}
  </style>
  <script src="preview-design-mode.js"></script>
</head>
<body class="saey-flow">
  <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div>
  <main class="flow-page">
    <header class="flow-head"><a class="flow-back" id="reviewsBack" href="12-product-details.html" aria-label="الرجوع لتفاصيل المنتج"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>كل التقييمات</h1><span></span></header>
    <section class="flow-card reviews-summary" id="reviewsSummary" hidden><strong id="reviewsAverage">—</strong><span aria-hidden="true">★★★★★</span><p id="reviewsCount"></p></section>
    <label class="reviews-filter" for="reviewsRating">التقييم
      <select id="reviewsRating"><option value="">كل التقييمات</option><option value="5">5 نجوم</option><option value="4">4 نجوم</option><option value="3">3 نجوم</option><option value="2">نجمتان</option><option value="1">نجمة واحدة</option></select>
    </label>
    <p class="review-status" id="reviewsStatus" role="status">جارٍ تحميل التقييمات...</p>
    <section id="reviewsList" aria-live="polite"></section>
    <button class="review-action" id="reviewsMore" type="button" hidden>عرض المزيد</button>
    <button class="review-action" id="reviewsRetry" type="button" hidden>إعادة المحاولة</button>
  </main>
  <script src="user-product-reviews.js"></script>
  <script src="user-experience.js"></script>
</body>
</html>
