<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سعي — منتجات مميزة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="catalog.css">
  <link rel="stylesheet" href="uber-ui.css">
  <script src="preview-design-mode.js"></script>
</head>
<body class="saey-catalog">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>
  <main class="catalog-page">
    <header class="catalog-header">
      <a class="catalog-back" href="08-user-home.html" aria-label="رجوع">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <h1>منتجات مميزة</h1>
      <span></span>
    </header>
    <div class="search-with-filter">
      <label class="catalog-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" placeholder="ابحث عن منتج">
      </label>
      <button class="open-filters" type="button" aria-label="فتح الفلاتر" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="21" x2="14" y1="4" y2="4"/>
          <line x1="10" x2="3" y1="4" y2="4"/>
          <line x1="21" x2="12" y1="12" y2="12"/>
          <line x1="8" x2="3" y1="12" y2="12"/>
          <line x1="21" x2="16" y1="20" y2="20"/>
          <line x1="12" x2="3" y1="20" y2="20"/>
          <line x1="14" x2="14" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="10" y2="14"/>
          <line x1="16" x2="16" y1="18" y2="22"/>
        </svg>
      </button>
    </div>
    <p class="catalog-subtitle product-results" id="featuredResultLabel" aria-live="polite">جارٍ تحميل المنتجات…</p>
    <section class="catalog-products featured-products-page" id="featuredProducts" aria-live="polite" aria-busy="true"></section><button type="button" id="featuredLoadMore" hidden style="width:100%;height:44px;margin:12px 0;border:1px solid #E1E8F0;border-radius:10px;background:#FFF;font:800 12px Cairo,sans-serif">عرض المزيد</button><p id="featuredMessage" role="status" aria-live="polite"></p>
  </main>
  <div class="sheet-backdrop" id="filterSheet" aria-hidden="true">
    <section class="filter-sheet" role="dialog" aria-modal="true" aria-labelledby="filterTitle">
      <div class="sheet-handle"></div>
      <header>
        <h2 id="filterTitle">فلترة المنتجات</h2>
        <button class="close-sheet" type="button" aria-label="إغلاق">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="filter-label">الفئة الفرعية</div>
      <div class="filter-scroller">
        <button class="filter-chip selected" type="button">الكل</button>
        <button class="filter-chip" type="button">فساتين</button>
        <button class="filter-chip" type="button">جاكيتات</button>
        <button class="filter-chip" type="button">قمصان</button>
        <button class="filter-chip" type="button">أحذية</button>
      </div>
      <div class="filter-label">المحافظة</div>
      <select class="sheet-select" id="featuredGovernorate" aria-label="المحافظة"><option value="">كل المحافظات</option></select>
      <div class="filter-label">الترتيب حسب</div>
      <div class="sort-options">
        <button class="sort-option selected" type="button" data-sort="highest_rated">الأعلى تقييمًا</button>
        <button class="sort-option" type="button" data-sort="most_purchased">الأكثر طلبًا</button>
        <button class="sort-option" type="button" data-sort="newest">مضاف حديثًا</button>
      </div>
      <button class="apply-filters" type="button">عرض النتائج</button>
    </section>
  </div>
  <nav class="saey-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="08-user-home.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-9h6v9"/></svg></span><span>الرئيسية</span></a>
    <a class="active" href="09-categories.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>الأقسام</span></a>
    <a href="16-orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/></svg></span><span>الطلبات</span></a>
    <a href="15-account.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span>حسابي</span></a>
  </nav>
  <script>
    const sheet = document.getElementById('filterSheet'),
          open = document.querySelector('.open-filters'),
          close = () => {
            sheet.classList.remove('is-open');
            sheet.setAttribute('aria-hidden','true');
            open.setAttribute('aria-expanded','false');
          };
    open.addEventListener('click', () => {
      sheet.classList.add('is-open');
      sheet.setAttribute('aria-hidden','false');
      open.setAttribute('aria-expanded','true');
    });
    sheet.addEventListener('click', e => {
      if (e.target === sheet || e.target.closest('.close-sheet') || e.target.closest('.apply-filters')) close();
    });
    document.querySelectorAll('.filter-scroller, .sort-options').forEach(g => g.addEventListener('click', e => {
      const c = e.target.closest('.filter-chip, .sort-option');
      if (!c) return;
      g.querySelectorAll('.filter-chip, .sort-option').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected');
    }));
    document.querySelectorAll('.catalog-product-image button').forEach(b => b.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      b.classList.toggle('saved');
      const svg = b.querySelector('svg');
      if (b.classList.contains('saved')) {
        svg.setAttribute('fill', '#EF4444');
      } else {
        svg.setAttribute('fill', 'none');
      }
    }));
  </script>
  <script src="user-featured-products.js"></script>
</body>
</html>
