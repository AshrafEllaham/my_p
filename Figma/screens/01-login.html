<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 — تسجيل الدخول | تطبيق سعي للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    .barq-phone-country {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-inline-start: 8px;
    }
    .barq-country-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--barq-line);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--barq-ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .barq-country-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      min-width: 140px;
      background: #FFFFFF;
      border: 1px solid var(--barq-line);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 4px;
      gap: 2px;
    }
    .barq-country-option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 0;
      background: transparent;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--barq-ink);
      cursor: pointer;
    }
    .barq-country-option:hover {
      background: var(--barq-blue-soft);
      color: var(--barq-blue);
    }
  </style>
</head>
<body class="barq-auth-body">

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">

    <!-- Centered Brand Logo Mark -->
    <div class="barq-brand-centered">
      <span class="barq-brand-text">سعي</span>
      <div class="barq-brand-badge">
        <svg viewBox="0 0 64 64" fill="none" style="width: 24px; height: 24px;">
          <path d="M16.5 42c5.1 0 7.3-5.2 10.5-10.4 3.1-5 5.8-9.3 10.5-9.3 5 0 8.1 3.9 12 9.6" stroke="#FFF" stroke-width="5.25" stroke-linecap="round"/>
          <path d="m44.7 25.7 5.5 6.6-8 .6" stroke="#FFF" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.5" cy="42" r="2.55" fill="#FFF"/>
        </svg>
      </div>
    </div>

    <!-- Screen Title & Subtitle -->
    <section class="barq-hero">
      <h1>تسجيل الدخول</h1>
      <p>مرحباً بك مجدداً في تطبيق سعي للتوزيع</p>
    </section>

    <!-- Social Login Buttons -->
    <div id="socialRowTop" class="barq-social-row">
      <button class="barq-social-btn social-login" id="appleLoginTop" type="button" data-provider="apple">
        <svg class="barq-provider-logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#0F172A" d="M17.05 12.54c-.02-2.07 1.69-3.07 1.77-3.12a3.8 3.8 0 0 0-2.98-1.61c-1.25-.13-2.46.75-3.1.75-.64 0-1.63-.73-2.68-.71a3.96 3.96 0 0 0-3.33 2.03c-1.43 2.48-.36 6.14 1 8.15.67.98 1.46 2.08 2.5 2.04 1-.04 1.37-.65 2.57-.65 1.2 0 1.54.65 2.59.63 1.08-.02 1.76-.98 2.42-1.96a8.03 8.03 0 0 0 1.1-2.27 3.5 3.5 0 0 1-1.86-3.28ZM15.02 6.49c.56-.68.94-1.62.84-2.56-.52.6-.97 1.56-.85 2.47.9.07 1.82-.46 2.38-1.13Z"/></svg>
        <span>تسجيل ابل</span>
      </button>
      <button class="barq-social-btn social-login" id="googleLoginTop" type="button" data-provider="google">
        <svg class="barq-provider-logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.25-.2-1.8H12v3.41h5.37a4.6 4.6 0 0 1-1.99 3.02v2.48h3.2c1.87-1.72 2.77-4.25 2.77-7.11Z"/><path fill="#34A853" d="M12 21.7c2.67 0 4.91-.88 6.55-2.38l-3.2-2.48c-.88.59-2.01 1-3.35 1-2.58 0-4.77-1.74-5.55-4.08H3.15v2.56A9.9 9.9 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.45 13.76A5.94 5.94 0 0 1 6.14 12c0-.61.11-1.21.31-1.76V7.68H3.15A9.9 9.9 0 0 0 2.1 12c0 1.56.37 3.03 1.05 4.32l3.3-2.56Z"/><path fill="#EA4335" d="M12 6.16c1.45 0 2.74.5 3.76 1.48l2.82-2.82C16.9 3.22 14.67 2.3 12 2.3a9.9 9.9 0 0 0-8.85 5.38l3.3 2.56C7.23 7.9 9.42 6.16 12 6.16Z"/></svg>
        <span>تسجيل جوجل</span>
      </button>
    </div>


    <!-- Divider -->
    <div id="dividerTop" class="barq-divider">أو</div>

    <!-- Segmented Tab Bar -->
    <div class="barq-switch" role="tablist">
      <button id="phoneTab" type="button" role="tab" aria-selected="false">رقم الهاتف</button>
      <button class="active" id="emailTab" type="button" role="tab" aria-selected="true">البريد الإلكتروني</button>
    </div>

    <!-- Identity Input Card -->
    <div class="barq-input-card">
      <label class="barq-input-label" id="identityLabel" for="identityInput">البريد الإلكتروني</label>
      <div class="barq-input-inner">
        <div class="barq-input-icon" id="identityIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </div>
        <input id="identityInput" type="email" placeholder="example@mail.com" value="">
        <div class="barq-phone-country" id="phoneCountry" hidden>
          <button class="barq-country-trigger" id="countryTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="اختيار كود الدولة">
            <span class="barq-country-flag" id="countryFlag">🇪🇬</span><span id="countryDial">+20</span>
            <svg class="barq-country-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="barq-country-menu" id="countryMenu" role="listbox" hidden>
            <button class="barq-country-option" type="button" role="option" data-flag="🇪🇬" data-code="+20"><span>🇪🇬 مصر</span><span class="dial-code">+20</span></button>
            <button class="barq-country-option" type="button" role="option" data-flag="🇸🇦" data-code="+966"><span>🇸🇦 السعودية</span><span class="dial-code">+966</span></button>
            <button class="barq-country-option" type="button" role="option" data-flag="🇦🇪" data-code="+971"><span>🇦🇪 الإمارات</span><span class="dial-code">+971</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Password Input Card -->
    <div class="barq-input-card">
      <label class="barq-input-label" for="passwordInput">كلمة المرور</label>
      <div class="barq-input-inner">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input id="passwordInput" type="password" placeholder="••••••••" value="">
        <button class="barq-eye-btn" id="togglePasswordBtn" type="button" aria-label="إظهار/إخفاء كلمة المرور">
          <svg viewBox="0 0 24 24" id="eyeIcon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
      </div>
    </div>

    <a class="barq-forgot-link" href="07-forgot-password.html">نسيت كلمة المرور؟</a>

    <a class="barq-btn-primary" href="08-user-home.html">تسجيل الدخول</a>

    <div class="barq-footer">
      ليس لديك حساب؟ <a href="02-signup.html">إنشاء حساب جديد</a>
    </div>

  </main>

  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const phoneTab = document.getElementById('phoneTab');
    const emailTab = document.getElementById('emailTab');
    const identityLabel = document.getElementById('identityLabel');
    const identityInput = document.getElementById('identityInput');
    const identityIcon = document.getElementById('identityIcon');
    const phoneCountry = document.getElementById('phoneCountry');
    const countryTrigger = document.getElementById('countryTrigger');
    const countryMenu = document.getElementById('countryMenu');
    const countryFlag = document.getElementById('countryFlag');
    const countryDial = document.getElementById('countryDial');

    function setTab(mode) {
      if (mode === 'phone') {
        phoneTab.classList.add('active');
        emailTab.classList.remove('active');
        identityLabel.textContent = 'رقم الهاتف';
        identityInput.type = 'tel';
        identityInput.inputMode = 'tel';
        identityInput.placeholder = '10 1234 5678';
        identityIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
        phoneCountry.hidden = false;
      } else {
        emailTab.classList.add('active');
        phoneTab.classList.remove('active');
        identityLabel.textContent = 'البريد الإلكتروني';
        identityInput.type = 'email';
        identityInput.inputMode = 'email';
        identityInput.placeholder = 'example@mail.com';
        identityIcon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>`;
        phoneCountry.hidden = true;
        phoneCountry.classList.remove('open');
        countryMenu.hidden = true;
        countryTrigger.setAttribute('aria-expanded', 'false');
      }
    }

    emailTab.addEventListener('click', () => setTab('email'));
    phoneTab.addEventListener('click', () => setTab('phone'));

    countryTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = !countryMenu.hidden;
      countryMenu.hidden = isOpen;
      phoneCountry.classList.toggle('open', !isOpen);
      countryTrigger.setAttribute('aria-expanded', String(!isOpen));
    });

    document.querySelectorAll('.barq-country-option').forEach(option => {
      option.addEventListener('click', () => {
        countryFlag.textContent = option.dataset.flag;
        countryDial.textContent = option.dataset.code;
        countryMenu.hidden = true;
        phoneCountry.classList.remove('open');
        countryTrigger.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', (event) => {
      if (!phoneCountry.contains(event.target)) {
        countryMenu.hidden = true;
        phoneCountry.classList.remove('open');
        countryTrigger.setAttribute('aria-expanded', 'false');
      }
    });

    const passwordInput = document.getElementById('passwordInput');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      if (isPass) {
        eyeIcon.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>`;
      } else {
        eyeIcon.innerHTML = `<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>`;
      }
    });

    const socialIsNew = new URLSearchParams(window.location.search).get('social') === 'new';
    document.querySelectorAll('.social-login').forEach(button => {
      button.addEventListener('click', () => {
        const provider = button.dataset.provider;
        window.location.href = socialIsNew
          ? `03-verify-otp.html?source=${provider}`
          : `08-user-home.html?provider=${provider}`;
      });
    });
  </script>
</body>
</html>
