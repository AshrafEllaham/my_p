<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>01 — تسجيل الدخول</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="auth.css">
  <style>
    body.login-reference {
      background: radial-gradient(circle at 80% 5%, rgba(29, 78, 216, 0.05) 0%, transparent 45%),
                  radial-gradient(circle at 10% 95%, rgba(245, 158, 11, 0.04) 0%, transparent 40%),
                  #F4F6FA;
      color: #0F172A;
    }
    .login-page {
      width: min(100%, 430px);
      min-height: calc(100vh - 46px);
      margin: 0 auto;
      padding: 16px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-hero {
      text-align: right;
      padding: 4px 2px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .login-hero-logo {
      width: 104px;
      height: 104px;
      object-fit: contain;
      align-self: center;
      filter: drop-shadow(0 12px 24px rgba(29, 78, 216, 0.22));
      margin: 0 auto 12px;
    }
    .login-hero h1 {
      font-size: 26px;
      line-height: 1.25;
      font-weight: 900;
      color: #0F172A;
      margin: 0;
      letter-spacing: -0.5px;
    }
    .login-hero p {
      font-size: 13px;
      color: #64748B;
      margin-top: 5px;
    }
    .login-page .auth-topbar {
      justify-content: flex-start;
    }
    .login-switch {
      height: 44px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 22px;
      display: flex;
      align-items: center;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }
    .login-switch button {
      height: 38px;
      flex: 1;
      border: 0;
      border-radius: 19px;
      background: transparent;
      color: #64748B;
      font: 800 13px 'Cairo', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .login-switch button.active {
      color: #FFFFFF;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.25);
    }
    .login-field-card {
      min-height: 68px;
      border-radius: 16px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
      border: 1px solid #E2E8F0;
      transition: all 0.2s;
    }
    .login-field-card:focus-within {
      border-color: #1D4ED8;
      box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
    }
    .login-field-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #EFF6FF;
      color: #1D4ED8;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .login-field-icon svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .login-field-content {
      flex: 1;
      min-width: 0;
      padding: 0 12px;
    }
    .login-field-content label {
      display: block;
      color: #0F172A;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 2px;
    }
    .login-field-content input {
      width: 100%;
      border: 0;
      outline: 0;
      padding: 0;
      background: transparent;
      color: #0F172A;
      font: 600 13px 'Cairo', sans-serif;
    }
    .login-field-content input::placeholder {
      color: #94A3B8;
      font-weight: 500;
    }
    .login-phone-code {
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #0F172A;
      font: 700 12px 'Plus Jakarta Sans', sans-serif;
      white-space: nowrap;
      background: #F8FAFC;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #E2E8F0;
    }
    .login-phone-code span { font-size: 16px; }
    .login-phone-code i { font-style: normal; font-size: 13px; color: #0F172A; font-weight: 700; }
    .login-forgot {
      align-self: flex-start;
      margin-top: -6px;
      color: #1D4ED8;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding-inline: 4px;
      transition: color 0.2s;
    }
    .login-forgot:hover {
      color: #1E40AF;
      text-decoration: underline;
    }
    .login-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .login-or {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 700;
      justify-content: center;
    }
    .login-or:before, .login-or:after {
      content: '';
      height: 1px;
      background: #E2E8F0;
      flex: 1;
    }
    .login-social-row {
      display: flex;
      gap: 10px;
      direction: rtl;
    }
    .login-social {
      height: 50px;
      flex: 1;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      background: #FFFFFF;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: 700 12px 'Cairo', sans-serif;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: all 0.2s;
    }
    .login-social:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
      transform: translateY(-1px);
    }
    .login-social svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .login-brand {
      text-align: center;
      color: #64748B;
      font-size: 12.5px;
      margin-top: 4px;
    }
    .login-brand a {
      color: #1D4ED8;
      font-weight: 800;
      text-decoration: none;
    }
    .login-brand a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body class="login-reference">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">📶 🔋</div>
  </div>
  <main class="login-page">
    <div class="auth-topbar"><a class="auth-back" href="00-splash.html">→</a></div>
    <section class="login-hero">
      <img class="login-hero-logo" src="logo-mark.svg" alt="شعار سوق مصر">
      <h1>مرحبًا بك في سوق مصر!</h1>
      <p>سجل دخولك لتجربة تسوق سريعة وموثوقة.</p>
    </section>
    <div class="login-switch">
      <button class="active" id="phoneTab" type="button">رقم الموبايل</button>
      <button id="emailTab" type="button">البريد الإلكتروني</button>
    </div>
    <div class="login-field-card">
      <div class="login-field-icon">
        <svg viewBox="0 0 24 24"><path d="M6.5 4.5h3l1.5 4-2 1.5a14 14 0 0 0 5 5l1.5-2 4 1.5v3a2 2 0 0 1-2 2C10.6 19.5 4.5 13.4 4.5 6.5a2 2 0 0 1 2-2Z"/></svg>
      </div>
      <div class="login-field-content">
        <label id="loginIdentityLabel">رقم الموبايل</label>
        <input id="loginIdentityInput" type="tel" placeholder="أدخل رقم الموبايل" value="">
      </div>
      <div class="login-phone-code"><span>🇪🇬</span><i>+20</i><b>⌄</b></div>
    </div>
    <div class="login-field-card">
      <div class="login-field-icon">
        <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
      </div>
      <div class="login-field-content">
        <label>كلمة المرور</label>
        <input type="password" placeholder="أدخل كلمة المرور">
      </div>
      <button id="passwordToggle" type="button" aria-label="إظهار كلمة المرور" style="border:0;background:transparent;color:#64748B;cursor:pointer;line-height:1">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 4.3A10.8 10.8 0 0 1 12 4c5 0 8.5 4 9.5 6a12.8 12.8 0 0 1-3.4 3.9M6.2 6.2A13.3 13.3 0 0 0 2.5 10c1 2 4.5 6 9.5 6 1 0 2-.2 2.8-.5"/></svg>
      </button>
    </div>
    <a class="login-forgot" href="07-forgot-password.html">نسيت كلمة المرور؟</a>
    <div class="login-bottom">
      <button class="auth-btn" id="loginSubmit" type="button">تسجيل الدخول <span>←</span></button>
      <div class="login-or">أو</div>
      <div class="login-social-row">
        <button class="login-social google" id="googleLogin" type="button">
          <span>حساب Google</span>
          <svg viewBox="0 0 24 24" aria-label="Google"><path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.25-.2-1.8H12v3.41h5.37a4.6 4.6 0 0 1-1.99 3.02v2.48h3.2c1.87-1.72 2.77-4.25 2.77-7.11Z"/><path fill="#34A853" d="M12 21.7c2.67 0 4.91-.88 6.55-2.38l-3.2-2.48c-.88.59-2.01 1-3.35 1-2.58 0-4.77-1.74-5.55-4.08H3.15v2.56A9.9 9.9 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.45 13.76A5.94 5.94 0 0 1 6.14 12c0-.61.11-1.21.31-1.76V7.68H3.15A9.9 9.9 0 0 0 2.1 12c0 1.56.37 3.03 1.05 4.32l3.3-2.56Z"/><path fill="#EA4335" d="M12 6.16c1.45 0 2.74.5 3.76 1.48l2.82-2.82C16.9 3.22 14.67 2.3 12 2.3a9.9 9.9 0 0 0-8.85 5.38l3.3 2.56C7.23 7.9 9.42 6.16 12 6.16Z"/></svg>
        </button>
        <button class="login-social apple" id="appleLogin" type="button">
          <span>حساب Apple</span>
          <svg viewBox="0 0 24 24" aria-label="Apple" fill="#0F172A"><path d="M17.05 12.54c-.02-2.07 1.69-3.07 1.77-3.12a3.8 3.8 0 0 0-2.98-1.61c-1.25-.13-2.46.75-3.1.75-.64 0-1.63-.73-2.68-.71a3.96 3.96 0 0 0-3.33 2.03c-1.43 2.48-.36 6.14 1 8.15.67.98 1.46 2.08 2.5 2.04 1-.04 1.37-.65 2.57-.65 1.2 0 1.54.65 2.59.63 1.08-.02 1.76-.98 2.42-1.96a8.03 8.03 0 0 0 1.1-2.27 3.5 3.5 0 0 1-1.86-3.28ZM15.02 6.49c.56-.68.94-1.62.84-2.56-.52.6-.97 1.56-.85 2.47.9.07 1.82-.46 2.38-1.13Z"/></svg>
        </button>
      </div>
      <div class="login-brand">ليس لديك حساب؟ <a class="auth-link" href="02-signup.html">إنشاء حساب جديد</a></div>
    </div>
  </main>
  <div class="home-bar"><div class="home-bar-pill"></div></div>
  <script>
    const phoneTab = document.getElementById('phoneTab');
    const emailTab = document.getElementById('emailTab');
    const identityLabel = document.getElementById('loginIdentityLabel');
    const identityInput = document.getElementById('loginIdentityInput');
    const switchLoginMode = (mode) => {
      const phone = mode === 'phone';
      phoneTab.classList.toggle('active', phone);
      emailTab.classList.toggle('active', !phone);
      identityLabel.textContent = phone ? 'رقم الموبايل' : 'البريد الإلكتروني';
      identityInput.type = phone ? 'tel' : 'email';
      identityInput.placeholder = phone ? 'أدخل رقم الموبايل' : 'أدخل البريد الإلكتروني';
      document.querySelector('.login-phone-code').style.visibility = phone ? 'visible' : 'hidden';
    };
    phoneTab.addEventListener('click', () => switchLoginMode('phone'));
    emailTab.addEventListener('click', () => switchLoginMode('email'));
    document.getElementById('passwordToggle').addEventListener('click', () => {
      const password = document.querySelector('.login-field-card input[type="password"], .login-field-card input[type="text"].password-revealed');
      if (!password) return;
      const reveal = password.type === 'password';
      password.type = reveal ? 'text' : 'password';
      password.classList.toggle('password-revealed', reveal);
    });
    document.getElementById('loginSubmit').addEventListener('click', () => alert('تم الضغط على تسجيل الدخول — سيتم ربطه بالـAPI لاحقًا.'));
    document.getElementById('googleLogin').addEventListener('click', () => alert('سيتم فتح تسجيل الدخول باستخدام Google.'));
    document.getElementById('appleLogin').addEventListener('click', () => alert('سيتم فتح تسجيل الدخول باستخدام Apple.'));
  </script>
  <script src="i18n.js"></script>
</body>
</html>
