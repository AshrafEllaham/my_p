<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>03 — التحقق من الرمز | تطبيق سعي للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="barq-auth-body">

  <!-- Status Bar & Dynamic Island -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">

    <!-- Top Bar with Circular Back Button -->
    <div class="barq-topbar">
      <a class="barq-back-circle" href="01-login.html" title="العودة">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </a>
    </div>

    <!-- Screen Title & Subtitle -->
    <section class="barq-hero" style="margin-top: 10px;">
      <h1>التحقق من الرمز</h1>
      <p>أدخل رمز التحقق المكون من 4 أرقام الذي أرسلناه للتو إلى رقم هاتفك المحمول <strong style="color: var(--barq-ink); font-family: 'Inter', sans-serif;">00***50</strong></p>
    </section>

    <!-- OTP Track -->
    <div class="barq-otp-track" id="otpTrack" style="margin-top: 18px;">
      <div class="barq-otp-cell" data-index="0">5</div>
      <div class="barq-otp-cell" data-index="1">8</div>
      <div class="barq-otp-cell active" data-index="2">
        <span class="barq-cursor"></span>
      </div>
      <div class="barq-otp-cell" data-index="3"></div>
    </div>

    <!-- Hidden real input for typing interaction -->
    <input type="text" id="hiddenOtpInput" maxlength="4" value="58" style="position: absolute; opacity: 0; pointer-events: none;">

    <!-- Resend Countdown & Action -->
    <div class="barq-resend-box" style="margin-top: 24px;">
      <div class="barq-resend-timer" id="timerDisplay">إعادة الإرسال خلال <span style="font-family: 'Inter', sans-serif;" id="timerDigits">00:30</span></div>
      <button class="barq-resend-btn" id="resendBtn" type="button">إعادة إرسال الرمز</button>
    </div>

    <!-- Primary Action Button: تحقق -->
    <a class="barq-btn-primary" href="05-profile-setup.html" style="margin-top: 24px;">تحقق</a>

  </main>

  <!-- iOS Home Bar -->
  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const otpTrack = document.getElementById('otpTrack');
    const hiddenInput = document.getElementById('hiddenOtpInput');
    const cells = Array.from(document.querySelectorAll('.barq-otp-cell'));

    function updateCells() {
      const val = hiddenInput.value;
      cells.forEach((cell, idx) => {
        cell.classList.remove('active');
        if (idx < val.length) {
          cell.textContent = val[idx];
        } else if (idx === val.length) {
          cell.innerHTML = '<span class="barq-cursor"></span>';
          cell.classList.add('active');
        } else {
          cell.textContent = '';
        }
      });
    }

    otpTrack.addEventListener('click', () => {
      hiddenInput.focus();
    });

    hiddenInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      updateCells();
    });

    hiddenInput.addEventListener('focus', () => {
      updateCells();
    });

    // Simple countdown timer
    let secondsLeft = 30;
    const timerDigits = document.getElementById('timerDigits');
    const resendBtn = document.getElementById('resendBtn');

    const countdown = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(countdown);
        timerDigits.textContent = '00:00';
        resendBtn.style.color = 'var(--barq-blue)';
        resendBtn.style.cursor = 'pointer';
      } else {
        const str = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
        timerDigits.textContent = '00:' + str;
      }
    }, 1000);
  </script>
</body>
</html>
