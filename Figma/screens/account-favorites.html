<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — المفضلة</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="uber-ui.css"><style>.favorites-tabs{display:flex;gap:4px;margin-bottom:12px;padding:4px;border-radius:12px;background:#EEF1F4}.favorites-tabs button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;color:#64748B;font:800 12px 'Cairo',sans-serif}.favorites-tabs button.active{background:#FFF;color:#000;box-shadow:0 2px 8px rgba(15,23,42,.08)}.favorite-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.favorite-product,.favorite-store{position:relative;display:block;overflow:hidden;padding:7px;border:1px solid #E7ECF3;border-radius:15px;background:#FFF;color:#0F172A;text-decoration:none}.favorite-product img,.favorite-store img{width:100%;height:130px;display:block;object-fit:cover;border-radius:11px}.favorite-product small,.favorite-product strong,.favorite-product b,.favorite-store small,.favorite-store strong{display:block}.favorite-product small,.favorite-store small{margin-top:7px;color:#64748B;font-size:11px}.favorite-product strong,.favorite-store strong{margin-top:2px;font-size:13px;line-height:1.45}.favorite-product b{margin-top:4px;color:#000;font-size:14px}.favorite-remove{position:absolute;top:13px;left:13px;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:9px;background:rgba(255,255,255,.92);color:#DC2626;font-size:17px;cursor:pointer}.favorites-empty{padding:70px 20px;text-align:center}.favorites-empty span{width:56px;height:56px;display:grid;place-items:center;margin:auto;border-radius:18px;background:#F2F2F2;font-size:24px}.favorites-empty h2{margin:12px 0 4px;font-size:16px}.favorites-empty p{margin:0;color:#64748B;font-size:12px}.favorites-empty a{display:inline-grid;place-items:center;height:40px;margin-top:14px;padding:0 16px;border-radius:10px;background:#000;color:#FFF;font-size:12px;font-weight:800;text-decoration:none}[hidden]{display:none!important}@media(max-width:370px){.favorite-product img,.favorite-store img{height:112px}.favorite-product strong,.favorite-store strong{font-size:12px}}</style></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮ ◔ ▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="15-account.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>المفضلة</h1><span class="view-head-spacer"></span></header><p class="view-intro">المنتجات والمتاجر التي حفظتها للرجوع إليها لاحقًا.</p><div class="favorites-tabs"><button class="active" type="button" data-panel="favoriteProducts">المنتجات</button><button type="button" data-panel="favoriteStores">المتاجر</button></div><section class="favorite-grid" id="favoriteProducts"></section><section class="favorite-grid" id="favoriteStores" hidden></section><section class="favorites-empty" id="favoritesEmpty" hidden><span>♡</span><h2>لا توجد عناصر محفوظة</h2><p>اضغط على علامة القلب داخل أي منتج أو متجر لحفظه هنا.</p><a href="08-user-home.html">اكتشف المنتجات</a></section></main><script src="user-state.js"></script><script>const productsPanel=document.getElementById('favoriteProducts'),storesPanel=document.getElementById('favoriteStores'),empty=document.getElementById('favoritesEmpty');const format=value=>`${Number(value).toLocaleString('ar-EG')} ج.م`;const render=()=>{const products=SaeyState.favorites(),stores=SaeyState.favoriteStores();productsPanel.innerHTML=products.map(item=>`<a class="favorite-product" href="${item.href||'12-product-details.html'}"><img src="${item.image}" alt="${item.name}"><small>${item.store}</small><strong>${item.name}</strong><b>${format(item.price)}</b><button class="favorite-remove" type="button" data-type="product" data-id="${item.id}" aria-label="إزالة من المفضلة">×</button></a>`).join('');storesPanel.innerHTML=stores.map(item=>`<a class="favorite-store" href="${item.href||'19-store-details.html'}"><img src="${item.image}" alt="${item.name}"><small>${item.category} · ${item.rating} ★</small><strong>${item.name}</strong><button class="favorite-remove" type="button" data-type="store" data-id="${item.id}" aria-label="إزالة من المفضلة">×</button></a>`).join('');const active=document.querySelector('.favorites-tabs button.active').dataset.panel;empty.hidden=(active==='favoriteProducts'?products:stores).length>0;};document.querySelectorAll('.favorites-tabs button').forEach(button=>button.onclick=()=>{document.querySelectorAll('.favorites-tabs button').forEach(item=>item.classList.toggle('active',item===button));productsPanel.hidden=button.dataset.panel!=='favoriteProducts';storesPanel.hidden=button.dataset.panel!=='favoriteStores';render();});document.addEventListener('click',event=>{const button=event.target.closest('.favorite-remove');if(!button)return;event.preventDefault();event.stopPropagation();if(button.dataset.type==='product'){const item=SaeyState.favorites().find(entry=>entry.id===button.dataset.id);if(item)SaeyState.toggleFavorite(item);}else{const item=SaeyState.favoriteStores().find(entry=>entry.id===button.dataset.id);if(item)SaeyState.toggleFavoriteStore(item);}render();});render();</script></body></html>
