<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — متابعة المشكلة</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="user-flows.css"><link rel="stylesheet" href="user-experience.css"><style>.dispute-note{padding:12px;border-radius:12px;background:#FFFBEB;color:#92400E;font-size:12px;line-height:1.7}.dispute-response textarea{box-sizing:border-box;width:100%;min-height:96px;padding:12px;border:1px solid #E1E8F1;border-radius:10px;font:600 13px 'Inter','Cairo',sans-serif;resize:none}</style></head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="flow-page"><header class="flow-head"><a class="flow-back" id="backLink" href="16-orders.html" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>متابعة المشكلة</h1><span></span></header><section class="flow-card"><div class="flow-row"><span>الطلب</span><strong id="orderCode" dir="ltr">—</strong></div><div class="flow-row"><span>الحالة</span><strong id="disputeStatus">—</strong></div></section><section class="flow-card"><h2>المشكلة المسجلة</h2><p class="dispute-note" id="disputeNote">—</p><div id="merchantDecision" hidden><h2>قرار المراجعة</h2><p class="dispute-note" id="decisionNote">—</p></div></section><section class="flow-card dispute-response" id="responseCard" hidden><h2>معلومات إضافية مطلوبة</h2><textarea id="customerResponse" placeholder="اكتب التفاصيل المطلوبة للمتجر أو فريق المراجعة"></textarea><p class="flow-error" id="responseError" hidden></p><button class="flow-primary" id="sendResponse" type="button">إرسال التفاصيل</button></section><a class="flow-secondary" href="account-contact.html" style="display:grid;place-items:center;text-decoration:none">التواصل مع دعم سعي</a></main><script src="user-state.js"></script><script src="user-experience.js"></script><script>const code=new URLSearchParams(location.search).get('code')||'',item=SaeyState.dispute(code);backLink.href=`21-order-details.html?code=${code}`;orderCode.textContent=`#${code}`;const labels={open:'وصل البلاغ',under_review:'قيد المراجعة',awaiting_customer:'بانتظار ردك',resolved:'تم الحسم'};disputeStatus.textContent=labels[item?.status]||'قيد المراجعة';disputeNote.textContent=item?.note||'لا توجد تفاصيل إضافية.';if(item?.resolution){merchantDecision.hidden=false;decisionNote.textContent=item.resolutionNote||(item.resolution==='refund'?'تم رد المبلغ إلى محفظتك.':item.resolution==='complete'?'تم اعتماد إتمام الطلب.':'مطلوب تفاصيل إضافية.')}if(item?.status==='awaiting_customer'){responseCard.hidden=false;sendResponse.onclick=()=>{const message=customerResponse.value.trim();if(message.length<10){responseError.textContent='اكتب تفاصيل لا تقل عن ١٠ أحرف.';responseError.hidden=false;return}SaeyState.respondToDispute(code,message);location.reload()}}</script></body></html>
