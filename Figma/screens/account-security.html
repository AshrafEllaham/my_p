<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — أمان الحساب</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="user-experience.css"></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮ ◔ ▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="15-account.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>أمان الحساب</h1><span class="view-head-spacer"></span></header><p class="view-intro">غيّر كلمة المرور أو تحكّم في حذف حسابك من سعي.</p><form class="view-card" id="passwordChangeForm"><h2 class="view-card-title">تغيير كلمة المرور</h2><div class="view-field"><label class="view-label" for="currentPassword">كلمة المرور الحالية</label><input class="view-input" id="currentPassword" name="current_password" type="password" autocomplete="current-password" required></div><div class="view-field"><label class="view-label" for="newPassword">كلمة المرور الجديدة</label><input class="view-input" id="newPassword" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="view-field"><label class="view-label" for="confirmPassword">تأكيد كلمة المرور</label><input class="view-input" id="confirmPassword" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required></div><p class="view-message" id="securityMessage" hidden></p><button class="view-button" id="savePasswordButton" type="submit">حفظ كلمة المرور</button></form><section class="view-card danger-zone"><h2 class="view-card-title">حذف الحساب</h2><p>سيتم حذف الحساب فورًا من تطبيق سعي.</p><button class="view-button danger" id="openDeleteAccount" type="button">حذف الحساب</button></section></main><dialog class="account-confirm-dialog" id="deleteAccountDialog"><form method="dialog"><h2>هل تريد حذف الحساب؟</h2><p>هذا إجراء حساس. اكتب «حذف» للتأكيد.</p><input class="view-input" id="deleteConfirmText" type="text" autocomplete="off" placeholder="اكتب حذف"><p class="view-message error" id="deleteError" hidden>اكتب كلمة «حذف» أولًا.</p><div class="confirm-actions"><button class="view-button secondary" value="cancel">تراجع</button><button class="view-button danger" id="confirmDeleteAccount" value="default">تأكيد الحذف</button></div></form></dialog><script src="account-api.js"></script><script>
const form = document.getElementById('passwordChangeForm');
const message = document.getElementById('securityMessage');
const saveButton = document.getElementById('savePasswordButton');
const dialog = document.getElementById('deleteAccountDialog');

form.addEventListener('submit', async event => {
  event.preventDefault();
  const token = localStorage.getItem('saey_api_token');
  const currentPassword = document.getElementById('currentPassword').value;
  const password = document.getElementById('newPassword').value;
  const passwordConfirmation = document.getElementById('confirmPassword').value;

  if (!token) {
    message.textContent = 'انتهت جلسة الدخول. سجل الدخول ثم حاول مرة أخرى.';
    message.className = 'view-message error';
    message.hidden = false;
    return;
  }

  if (password !== passwordConfirmation) {
    message.textContent = 'تأكيد كلمة المرور غير متطابق.';
    message.className = 'view-message error';
    message.hidden = false;
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = 'جارٍ حفظ كلمة المرور…';
  message.hidden = true;

  try {
    const response = await fetch('http://127.0.0.1:8000/api/change-password', {
      method: 'PUT',
      headers: {
        'Accept': 'application/json',
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        current_password: currentPassword,
        password,
        password_confirmation: passwordConfirmation
      })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.message || 'تعذر تغيير كلمة المرور.');

    message.textContent = result.message || 'تم تغيير كلمة المرور بنجاح.';
    message.className = 'view-message success';
    message.hidden = false;
    form.reset();
  } catch (requestError) {
    message.textContent = requestError instanceof TypeError
      ? 'تعذر الاتصال بالخادم. تحقق من تشغيل API ثم أعد المحاولة.'
      : requestError.message;
    message.className = 'view-message error';
    message.hidden = false;
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = 'حفظ كلمة المرور';
  }
});

document.getElementById('openDeleteAccount').onclick = () => dialog.showModal();
document.getElementById('confirmDeleteAccount').onclick = async event => {
  event.preventDefault();
  const confirmation = document.getElementById('deleteConfirmText').value.trim();
  const confirmButton = event.currentTarget;
  if (confirmation !== 'حذف') {
    document.getElementById('deleteError').hidden = false;
    document.getElementById('deleteError').textContent = 'اكتب كلمة «حذف» أولًا.';
    return;
  }
  confirmButton.disabled = true;
  document.getElementById('deleteError').hidden = true;
  try {
    const result = await SaeyAccountApi.request('/account', 'DELETE');
    dialog.close();
    message.textContent = result.message || 'تم حذف الحساب.';
    message.className = 'view-message success';
    message.hidden = false;
    SaeyAccountApi.clearToken();
    window.setTimeout(() => location.href = '01-login.html', 1200);
  } catch (error) {
    const deleteError = document.getElementById('deleteError');
    deleteError.textContent = error.message || 'تعذر حذف الحساب.';
    deleteError.hidden = false;
    confirmButton.disabled = false;
  }
};
</script><script src="user-experience.js"></script></body></html>
