<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — أمان الحساب</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="uber-ui.css"></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮ ◔ ▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="account-profile.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>أمان الحساب</h1><span class="view-head-spacer"></span></header><p class="view-intro">غيّر كلمة المرور أو تحكّم في حذف حسابك من سعي.</p><form class="view-card" id="passwordChangeForm"><h2 class="view-card-title">تغيير كلمة المرور</h2><div class="view-field"><label class="view-label" for="currentPassword">كلمة المرور الحالية</label><input class="view-input" id="currentPassword" type="password" required></div><div class="view-field"><label class="view-label" for="newPassword">كلمة المرور الجديدة</label><input class="view-input" id="newPassword" type="password" minlength="8" required></div><div class="view-field"><label class="view-label" for="confirmPassword">تأكيد كلمة المرور</label><input class="view-input" id="confirmPassword" type="password" minlength="8" required></div><p class="view-message" id="securityMessage" hidden></p><button class="view-button" type="submit">حفظ كلمة المرور</button></form><section class="view-card danger-zone"><h2 class="view-card-title">حذف الحساب</h2><p>سيتم حذف بيانات الحساب والطلبات والمحادثات بعد انتهاء فترة الاسترجاع.</p><button class="view-button danger" id="openDeleteAccount" type="button">حذف الحساب</button></section></main><dialog class="account-confirm-dialog" id="deleteAccountDialog"><form method="dialog"><h2>هل تريد حذف الحساب؟</h2><p>هذا إجراء حساس. اكتب «حذف» للتأكيد.</p><input class="view-input" id="deleteConfirmText" type="text" autocomplete="off" placeholder="اكتب حذف"><p class="view-message error" id="deleteError" hidden>اكتب كلمة «حذف» أولًا.</p><div class="confirm-actions"><button class="view-button secondary" value="cancel">تراجع</button><button class="view-button danger" id="confirmDeleteAccount" value="default">تأكيد الحذف</button></div></form></dialog><script>const form=document.getElementById('passwordChangeForm'),message=document.getElementById('securityMessage'),dialog=document.getElementById('deleteAccountDialog');form.onsubmit=event=>{event.preventDefault();const next=document.getElementById('newPassword').value,confirm=document.getElementById('confirmPassword').value;if(next.length<8||next!==confirm){message.textContent=next.length<8?'كلمة المرور يجب أن تكون ٨ أحرف على الأقل.':'كلمتا المرور غير متطابقتين.';message.className='view-message error';message.hidden=false;return;}localStorage.setItem('saey_password_changed_at',new Date().toISOString());message.textContent='تم تغيير كلمة المرور بنجاح.';message.className='view-message success';message.hidden=false;form.reset();};document.getElementById('openDeleteAccount').onclick=()=>dialog.showModal();document.getElementById('confirmDeleteAccount').onclick=event=>{if(document.getElementById('deleteConfirmText').value.trim()!=='حذف'){event.preventDefault();document.getElementById('deleteError').hidden=false;return;}localStorage.setItem('saey_account_deleted','true');location.href='01-login.html';};</script></body></html>
