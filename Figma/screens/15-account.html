  <main class="account-page">

      <a class="account-icon-button" href="08-user-home.html" aria-label="العودة للرئيسية"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <div class="account-profile">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&q=85" alt="صورة محمد">
        <div><h1>محمد</h1><span>id: ABC45678</span></div>

      <div class="account-actions">
        <a class="account-icon-button" href="14-chats.html" aria-label="الدردشات"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><i>2</i></a>
        <a class="account-icon-button" href="13-notifications.html" aria-label="الإشعارات"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i>2</i></a>

    </header>

    <p class="account-greeting">إدارة حسابك وتجربتك على سعي</p>

    <section class="account-section" aria-labelledby="discoverTitle">
      <h2 id="discoverTitle">اكتشف وحدك</h2>
      <div class="account-list">
        <a class="account-row" href="account-favorites.html"><span class="row-icon peach"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg></span><span>المفضلة</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </section>

    <section class="account-section" aria-labelledby="manageTitle">
      <h2 id="manageTitle">إدارة الحساب</h2>
      <div class="account-list">
        <a class="account-row" href="account-profile.html"><span class="row-icon violet"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>الملف الشخصي</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="account-row" href="account-pickup.html"><span class="row-icon blue"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span>موقع الاستلام</span><small>القاهرة</small><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </section>

    <section class="account-section" aria-labelledby="supportTitle">
      <h2 id="supportTitle">الإعدادات والدعم</h2>
      <div class="account-list">
        <button class="account-row" type="button" id="languageRow"><span class="row-icon blue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span>اللغة</span><small>العربية</small><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
        <a class="account-row" href="account-about.html"><span class="row-icon mint"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span><span>عن سعي</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="account-row" href="account-contact.html"><span class="row-icon peach"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H7l-3 3Z"/><path d="M8 9h8M8 13h5"/></svg></span><span>تواصل معنا</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="account-row" href="account-faq.html"><span class="row-icon blue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.4 1.6c-.9.9-1.9 1.2-1.9 2.4M12 16h.01"/></svg></span><span>الأسئلة الشائعة</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="account-row" href="account-terms.html"><span class="row-icon mint"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span>الشروط والأحكام</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
        <a class="account-row" href="account-privacy.html"><span class="row-icon violet"><svg viewBox="0 0 24 24"><path d="M12 3 20 6v5c0 5-3.5 8.3-8 10-4.5-1.7-8-5-8-10V6Z"/><path d="m9 12 2 2 4-4"/></svg></span><span>سياسة الخصوصية</span><svg class="row-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      </div>
    </section>

    <button class="logout-button" type="button" id="logoutButton"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/></svg>تسجيل الخروج</button>
    <span class="account-version">سعي · الإصدار 1.0.2</span>
  </main>

  <div class="language-sheet-backdrop" id="languageSheet" aria-hidden="true">
    <section class="language-sheet" role="dialog" aria-modal="true" aria-labelledby="languageSheetTitle">
      <div class="sheet-handle"></div>
      <header><h2 id="languageSheetTitle">اختيار اللغة</h2><button type="button" id="closeLanguageSheet" aria-label="إغلاق">×</button></header>
      <button class="language-option active" type="button" data-language="العربية"><span>العربية</span><i>✓</i></button>
      <button class="language-option" type="button" data-language="English"><span>English</span><i>✓</i></button>
      <button class="sheet-save" type="button" id="saveLanguage">حفظ الاختيار</button>
    </section>
  </div>

  <script>
    const languageSheet = document.getElementById('languageSheet');
    const languageLabel = document.querySelector('#languageRow small');
    const openLanguageSheet = () => { languageSheet.classList.add('visible'); languageSheet.setAttribute('aria-hidden', 'false'); };
    const closeLanguageSheet = () => { languageSheet.classList.remove('visible'); languageSheet.setAttribute('aria-hidden', 'true'); };
    document.getElementById('languageRow').addEventListener('click', openLanguageSheet);
    document.getElementById('closeLanguageSheet').addEventListener('click', closeLanguageSheet);
    languageSheet.addEventListener('click', (event) => { if (event.target === languageSheet) closeLanguageSheet(); });
    languageSheet.querySelectorAll('.language-option').forEach(option => option.addEventListener('click', () => {
      languageSheet.querySelectorAll('.language-option').forEach(item => item.classList.toggle('active', item === option));
    }));
    document.getElementById('saveLanguage').addEventListener('click', () => {
      languageLabel.textContent = languageSheet.querySelector('.language-option.active').dataset.language;
      closeLanguageSheet();
    });
    document.getElementById('logoutButton').addEventListener('click', () => {
      window.location.href = '01-login.html';
    });
  </script>
</body>
</html>
