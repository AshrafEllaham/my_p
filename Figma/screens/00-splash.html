<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>00 — شاشة البداية | تطبيق برق للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <style>
    body.barq-splash-body {
      background: radial-gradient(circle at 50% 30%, #1E3A8A 0%, #0F172A 100%);
      color: #FFFFFF;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      position: relative;
    }
    .splash-brand-mark {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 60%, #1D4ED8 100%);
      display: grid;
      place-items: center;
      box-shadow: 0 16px 36px rgba(37, 99, 235, 0.45);
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .splash-brand-mark svg {
      width: 52px;
      height: 52px;
    }
    .splash-brand-name {
      font-size: 38px;
      font-weight: 900;
      color: #FFFFFF;
      margin-top: 20px;
      letter-spacing: -0.5px;
    }
    .splash-brand-tagline {
      font-size: 14px;
      color: #94A3B8;
      margin-top: 6px;
      font-weight: 500;
    }
    .splash-start-btn {
      position: absolute;
      bottom: 40px;
      width: calc(100% - 60px);
      max-width: 360px;
      height: 50px;
      background: #2563EB;
      color: #FFFFFF;
      border: 0;
      border-radius: 14px;
      font: 800 14px 'Cairo', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body class="barq-splash-body">

  <div class="status-bar" style="color: #FFFFFF;">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">📶 🔋</div>
  </div>

  <div class="splash-container">
    <div class="splash-brand-mark">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="white" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="splash-brand-name">بـرق</div>
    <div class="splash-brand-tagline">تطبيق التوزيع الذكي والسريع</div>

    <a class="splash-start-btn" href="01-login.html">ابدأ الآن <span>←</span></a>
  </div>

  <div class="home-bar"><div class="home-bar-pill" style="background: rgba(255,255,255,0.3);"></div></div>

</body>
</html>
