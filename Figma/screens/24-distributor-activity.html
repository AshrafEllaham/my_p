<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — سجل النشاط</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"><link rel="stylesheet" href="merchant-ui-states.css"></head>
<body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div>
<main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="20-distributor-account.html" aria-label="العودة للحساب"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>سجل النشاط</h1><p>متابعة تغييرات المتجر والفريق</p></div><span></span></header><div class="ops-toolbar"><label class="ops-search"><svg class="ops-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="activitySearch" type="search" placeholder="ابحث في سجل النشاط"></label><select class="ops-filter" id="activityFilter" aria-label="تصفية النشاط"><option value="all">الكل</option><option value="orders">الطلبات</option><option value="inventory">المخزون</option><option value="finance">المالية</option><option value="team">الفريق</option></select></div><section id="activityList"></section></main>
<script src="merchant-state.js"></script><script src="merchant-ui-states.js"></script><script>
const icon='<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>';function render(){const q=activitySearch.value.trim(),f=activityFilter.value,rows=SaeyMerchant.activity().filter(x=>(f==='all'||x.type===f)&&(!q||`${x.title} ${x.detail} ${x.user}`.includes(q)));if(!rows.length)return SaeyUI.renderState(activityList,{title:'لا يوجد نشاط مطابق',message:'جرّب تغيير البحث أو نوع النشاط.'});let day='';activityList.innerHTML=rows.map(x=>{const heading=x.day!==day?(day=x.day,`<h2 class="activity-day">${x.day}</h2>`):'';return `${heading}<article class="activity-card ops-card"><span class="activity-icon"><svg class="ops-svg" viewBox="0 0 24 24">${icon}</svg></span><div><h3>${x.title}</h3><p>${x.detail} · <span class="activity-user">${x.user}</span></p></div><time>${x.time}</time></article>`}).join('')}activitySearch.oninput=render;activityFilter.onchange=render;render();
</script></body></html>
