<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>02 — إنشاء حساب جديد</title><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="auth.css"></head>
<body class="auth-v2 auth-signup">

      <div style="display:flex;gap:10px;margin-top:-2px"><button type="button" class="auth-btn secondary" style="flex:1;height:46px;padding:0">G&nbsp; Google</button><button type="button" class="auth-btn secondary" style="flex:1;height:46px;padding:0">&nbsp; Apple</button></div>

      <a class="auth-btn" href="03-verify-otp.html">متابعة واستلام رمز التحقق <span>←</span></a>

    <div class="auth-footer">لديك حساب بالفعل؟ <a class="auth-link" href="01-login.html">تسجيل الدخول</a></div>
