<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>02 — إنشاء حساب جديد | تطبيق سعي للتوزيع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="barq-auth-body">

  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="dynamic-island"><div class="camera-lens"></div></div>
    <div class="status-icons">
      <svg class="status-icon-cellular" viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg class="status-icon-wifi" viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg class="status-icon-battery" viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="barq-page">

    <!-- Top Navigation Bar -->
    <div class="barq-topbar" style="justify-content: flex-end;">
      <a class="barq-back-circle" href="01-login.html" title="العودة">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </a>
    </div>

    <!-- Centered Brand Logo Mark -->
    <div class="barq-brand-centered">
      <span class="barq-brand-text">سعي</span>
      <div class="barq-brand-badge">
        <svg viewBox="0 0 64 64" fill="none" style="width: 24px; height: 24px;">
          <path d="M16.5 42c5.1 0 7.3-5.2 10.5-10.4 3.1-5 5.8-9.3 10.5-9.3 5 0 8.1 3.9 12 9.6" stroke="#FFF" stroke-width="5.25" stroke-linecap="round"/>
          <path d="m44.7 25.7 5.5 6.6-8 .6" stroke="#FFF" stroke-width="4.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.5" cy="42" r="2.55" fill="#FFF"/>
        </svg>
      </div>
    </div>

    <section class="barq-hero">
      <h1>إنشاء حساب جديد</h1>
      <p>سجل بياناتك للبدء في استخدام منصة سعي</p>
    </section>

    <!-- Phone Number Input -->
    <div class="barq-input-card">
      <label class="barq-input-label">رقم الهاتف المحمول</label>
      <div class="barq-input-inner">
        <input id="signupPhone" type="tel" inputmode="tel" placeholder="10 1234 5678">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <div class="barq-phone-country" id="signupPhoneCountry">
          <button class="barq-country-trigger" id="signupCountryTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="اختيار كود الدولة">
            <span class="barq-country-flag" id="signupCountryFlag">🇪🇬</span><span id="signupCountryDial">+20</span>
            <svg class="barq-country-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="barq-country-menu" id="signupCountryMenu" role="listbox" hidden>
            <button class="barq-country-option" type="button" role="option" data-flag="🇪🇬" data-code="+20"><span>🇪🇬 مصر</span><span class="dial-code">+20</span></button>
            <button class="barq-country-option" type="button" role="option" data-flag="🇸🇦" data-code="+966"><span>🇸🇦 السعودية</span><span class="dial-code">+966</span></button>
            <button class="barq-country-option" type="button" role="option" data-flag="🇦🇪" data-code="+971"><span>🇦🇪 الإمارات</span><span class="dial-code">+971</span></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Email Input -->
    <div class="barq-input-card">
      <label class="barq-input-label">البريد الإلكتروني</label>
      <div class="barq-input-inner">
        <input id="signupEmail" type="email" placeholder="example@mail.com">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </div>
      </div>
    </div>

    <!-- Password Input -->
    <div class="barq-input-card">
      <label class="barq-input-label">كلمة المرور</label>
      <div class="barq-input-inner">
        <input id="signupPassword" type="password" placeholder="••••••••">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>
    </div>

    <!-- Confirm Password Input -->
    <div class="barq-input-card">
      <label class="barq-input-label">تأكيد كلمة المرور</label>
      <div class="barq-input-inner">
        <input id="signupConfirmPassword" type="password" placeholder="أعد كتابة كلمة المرور">
        <div class="barq-input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
      </div>
    </div>

    <p class="auth-form-error" id="signupError" hidden></p>
    <button class="barq-btn-primary" id="signupButton" type="button">متابعة</button>

    <div class="barq-footer">
      لديك حساب بالفعل؟ <a href="01-login.html">تسجيل الدخول</a>
    </div>

  </main>

  <div class="home-bar"><div class="home-bar-pill"></div></div>

  <script>
    const signupCountryTrigger = document.getElementById('signupCountryTrigger');
    const signupCountryMenu = document.getElementById('signupCountryMenu');
    const signupCountryFlag = document.getElementById('signupCountryFlag');
    const signupCountryDial = document.getElementById('signupCountryDial');
    const signupPhoneCountry = document.getElementById('signupPhoneCountry');

    signupCountryTrigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = !signupCountryMenu.hidden;
      signupCountryMenu.hidden = isOpen;
      signupPhoneCountry.classList.toggle('open', !isOpen);
      signupCountryTrigger.setAttribute('aria-expanded', String(!isOpen));
    });

    document.querySelectorAll('#signupCountryMenu .barq-country-option').forEach(option => {
      option.addEventListener('click', () => {
        signupCountryFlag.textContent = option.dataset.flag;
        signupCountryDial.textContent = option.dataset.code;
        signupCountryMenu.hidden = true;
        signupPhoneCountry.classList.remove('open');
        signupCountryTrigger.setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('click', (event) => {
      if (!signupPhoneCountry.contains(event.target)) {
        signupCountryMenu.hidden = true;
        signupPhoneCountry.classList.remove('open');
        signupCountryTrigger.setAttribute('aria-expanded', 'false');
      }
    });
    document.getElementById('signupButton').addEventListener('click', () => {
      const phone=document.getElementById('signupPhone').value.replace(/\D/g,''),email=document.getElementById('signupEmail').value.trim(),password=document.getElementById('signupPassword').value,confirm=document.getElementById('signupConfirmPassword').value,error=document.getElementById('signupError'),button=document.getElementById('signupButton');
      const validEmail=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if(phone.length<9||!validEmail||password.length<8||password!==confirm){error.textContent=phone.length<9?'اكتب رقم هاتف صحيحًا.':!validEmail?'اكتب بريدًا إلكترونيًا صحيحًا.':password.length<8?'كلمة المرور يجب ألا تقل عن ٨ أحرف.':'كلمتا المرور غير متطابقتين.';error.hidden=false;return;}
      error.hidden=true;button.disabled=true;button.textContent='جارٍ إنشاء الحساب…';localStorage.setItem('saey_signup_draft',JSON.stringify({phone:`${signupCountryDial.textContent}${phone}`,email,date:new Date().toISOString()}));setTimeout(()=>location.href='03-verify-otp.html',500);
    });
  </script>
</body>
</html>
