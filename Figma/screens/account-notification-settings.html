<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — إعدادات الإشعارات</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="account-view.css"><link rel="stylesheet" href="user-experience.css"></head><body class="saey-account-view"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮ ◔ ▰</div></div><main class="view-page"><header class="view-head"><a class="view-back" href="15-account.html" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>إعدادات الإشعارات</h1><span></span></header><p class="view-intro">اختر التحديثات التي تريد استقبالها من سعي.</p><section class="view-card" id="preferences"></section><button class="view-button" id="savePreferences">حفظ الإعدادات</button></main><script src="user-state.js"></script><script src="user-experience.js"></script><script>
const labels={orders:['تحديثات الطلبات','التأكيد والتجهيز وتغيّر الحالة'],pickup:['تنبيهات الاستلام','جاهزية الطلب وقرب انتهاء الحجز'],returns:['الاسترجاع والمبالغ','نتيجة الطلب وإعادة المبلغ'],chats:['رسائل المتاجر','الرسائل الجديدة والردود'],offers:['العروض والكوبونات','العروض المناسبة وتنبيهات انتهاء الكوبون']},values=SaeyState.notificationPreferences();function render(){preferences.innerHTML=Object.entries(labels).map(([key,text])=>`<div class="setting-toggle-row"><div><strong>${text[0]}</strong><small>${text[1]}</small></div><button class="view-switch ${values[key]?'active':''}" data-key="${key}" aria-label="${values[key]?'إيقاف':'تفعيل'} ${text[0]}"></button></div>`).join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{values[b.dataset.key]=!values[b.dataset.key];render()})}savePreferences.onclick=()=>{SaeyState.saveNotificationPreferences(values);SaeyUX.success('تم حفظ إعدادات الإشعارات')};render();
</script></body></html>
