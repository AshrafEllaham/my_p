<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — الفواتير والكشوف</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"><link rel="stylesheet" href="merchant-ui-states.css"></head><body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div><main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="22-distributor-finance.html" aria-label="العودة للمالية"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>الفواتير والكشوف</h1><p>مستندات المتجر المالية</p></div><span></span></header><section class="ops-intro"><div><h2>مركز المستندات</h2><p>عاين أو اطبع أي فاتورة بصيغة PDF.</p></div></section><div class="ops-tabs"><button class="active" data-view="invoices">فواتير الطلبات</button><button data-view="statements">كشوف التسوية</button></div><section class="bo-list" id="documentsList"></section></main><div class="ops-toast" id="toast"></div><script src="merchant-state.js"></script><script src="merchant-ui-states.js"></script><script>
const invoices=[{id:'INV-10928',ref:'SA-10928',date:'27 سبتمبر 2026',title:'فاتورة طلب — سارة أحمد',amount:1850,lines:[['جاكيت جلد طبيعي','١,٨٥٠ ج.م'],['عمولة سعي','١١١ ج.م']]},{id:'INV-10886',ref:'SA-10886',date:'26 سبتمبر 2026',title:'فاتورة طلب — نورهان حسن',amount:680,lines:[['حقيبة ظهر عملية','٦٨٠ ج.م'],['عمولة سعي','٤١ ج.م']]}];let view='invoices';const money=v=>`${Number(v).toLocaleString('ar-EG')} ج.م`;
function docs(){return view==='invoices'?invoices:SaeyMerchant.settlements().map(s=>({id:s.id,ref:s.id,date:s.date,title:'كشف تسوية بنكية',amount:s.net,lines:[['إجمالي المبيعات',money(s.gross)],['عمولة سعي',money(s.commission)],['صافي التسوية',money(s.net)]]}))}function render(){const rows=docs();documentsList.innerHTML=rows.map(d=>`<article class="document-card ops-card"><span class="document-icon"><svg class="ops-svg" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6Z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg></span><div><h3>${d.title}</h3><p>${d.id} · ${d.date} · ${money(d.amount)}</p></div><button class="download-button" data-doc="${d.id}" aria-label="طباعة ${d.id}"><svg class="ops-svg" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button></article>`).join('');if(!rows.length)documentsList.innerHTML='<div class="empty-state ops-card"><h3>لا توجد مستندات</h3><p>ستظهر الفواتير والكشوف هنا عند توفرها.</p></div>';document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>printDoc(docs().find(d=>d.id===b.dataset.doc)))}
function printDoc(d){const rows=d.lines.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join(''),win=open('','_blank','width=720,height=850');if(!win){toast.textContent='اسمح بالنوافذ المنبثقة لطباعة المستند';toast.classList.add('visible');return}win.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${d.id}</title><style>body{font-family:Arial;padding:42px;color:#111827}header{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:18px}h1{font-size:24px}small{color:#64748b}table{width:100%;border-collapse:collapse;margin-top:30px}td{padding:14px;border-bottom:1px solid #e2e8f0}td:last-child{text-align:left;font-weight:bold}.total{margin-top:28px;padding:18px;background:#f1f5f9;font-size:20px;font-weight:bold}</style></head><body><header><div><h1>سعي</h1><small>نقطة ستور</small></div><div><b>${d.id}</b><br><small>${d.date}</small></div></header><h2>${d.title}</h2><table>${rows}</table><div class="total">الإجمالي: ${money(d.amount)}</div></body></html>`);win.document.close();SaeyUI.success('تم فتح المستند للطباعة');setTimeout(()=>win.print(),300)}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
</script></body></html>
