<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — إضافة إعلان</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="trader.css"></head>
<body class="ad-editor-page">
  <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div>
  <main class="ad-editor-shell">
    <header class="ad-editor-header"><a href="19-distributor-ads.html" aria-label="العودة إلى الإعلانات"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div><small>إنشاء حملة</small><h1>إعلان جديد</h1></div><span class="ad-editor-state">مسودة</span></header>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></span><div><h2>محتوى الإعلان</h2><p>العنوان والصورة التي ستظهر للعملاء</p></div></header><label class="ad-editor-field"><span>عنوان الإعلان <b>*</b></span><input id="adTitle" maxlength="60" placeholder="مثال: خصم ٢٥٪ على منتجات الصيف"><small><i id="adTitleCount">٠</i> / ٦٠</small></label><label class="ad-upload-zone" id="adUploadZone"><input id="adMedia" type="file" accept="image/png,image/jpeg,video/mp4"><span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m7 16 4-4 3 3 2-2 3 3"/><circle cx="9" cy="9" r="1.5"/></svg></span><strong id="adUploadTitle">أضف صورة أو فيديو</strong><small id="adUploadHint">JPG أو PNG أو MP4 · حتى ٢٠ ميجابايت</small></label></section>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><path d="m4 12 15-7v14L4 12Z"/><path d="M4 12v5a2 2 0 0 0 2 2"/></svg></span><div><h2>مكان الظهور</h2><p>حدد أين تريد عرض حملتك</p></div></header><div class="ad-placement-grid" role="radiogroup" aria-label="مكان ظهور الإعلان"><button class="selected" type="button" data-placement="داخل القسم" data-extra="0"><i><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></i><span><strong>داخل القسم</strong><small>استهداف أدق</small></span><b>مدفوع</b></button><button type="button" data-placement="التطبيق كله" data-extra="200"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></i><span><strong>التطبيق كله</strong><small>وصول أكبر</small></span><b>مدفوع</b></button><button type="button" data-placement="صفحة متجري" data-extra="free"><i><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM6 10V6h12v4"/></svg></i><span><strong>صفحة متجري</strong><small>لزوّار متجرك</small></span><b class="free">مجاني</b></button></div></section>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span><div><h2>الباقة والموعد</h2><p>اختر مدة الحملة ووقت بدايتها</p></div></header><label class="ad-editor-field"><span>الباقة</span><select id="adPackage"><option value="350">ظهور مميز · ٧ أيام · ٣٥٠ ج.م</option><option value="150">ظهور قياسي · ٣ أيام · ١٥٠ ج.م</option></select></label><div class="ad-schedule-grid"><label class="ad-editor-field"><span>تاريخ البدء</span><input id="adStartDate" type="date"></label><label class="ad-editor-field"><span>وقت البدء</span><input id="adStartTime" type="time"></label></div></section>
    <section class="ad-budget-summary"><span><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM16 11h5v4h-5z"/><path d="M6 7V5h12v2"/></svg></span><div><small>تكلفة الحملة المتوقعة</small><strong id="campaignCost">٣٥٠ ج.م</strong><p id="walletAfterPayment">رصيد المحفظة بعد الدفع: ١,٨٩٠ ج.م</p></div><i>الرصيد كافٍ</i></section><p class="ad-editor-feedback" id="adEditorFeedback" role="alert"></p>
  </main>
  <footer class="ad-editor-actions"><button class="ad-save-draft" id="saveAdDraft" type="button">حفظ كمسودة</button><button class="ad-review-button" id="reviewAd" type="button">مراجعة ودفع الإعلان <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button></footer>
  <script>
    const titleInput=document.getElementById('adTitle'),packageSelect=document.getElementById('adPackage'),feedback=document.getElementById('adEditorFeedback'),walletBalance=2240;let campaignCost=350;const savedDraft=JSON.parse(localStorage.getItem('saey_ad_draft')||'null');
    const selectedPlacement=()=>document.querySelector('.ad-placement-grid button.selected');const updateCost=()=>{const extra=selectedPlacement().dataset.extra;campaignCost=extra==='free'?0:Number(packageSelect.value)+Number(extra);document.getElementById('campaignCost').textContent=campaignCost?`${campaignCost.toLocaleString('ar-EG')} ج.م`:'مجاني';document.getElementById('walletAfterPayment').textContent=campaignCost?`رصيد المحفظة بعد الدفع: ${(walletBalance-campaignCost).toLocaleString('ar-EG')} ج.م`:'لن يتم خصم أي مبلغ من المحفظة';packageSelect.disabled=extra==='free'};
    const collectAd=()=>({title:titleInput.value.trim(),placement:selectedPlacement().dataset.placement,package:packageSelect.options[packageSelect.selectedIndex].text,cost:campaignCost,date:document.getElementById('adStartDate').value,time:document.getElementById('adStartTime').value});
    titleInput.addEventListener('input',()=>document.getElementById('adTitleCount').textContent=titleInput.value.length.toLocaleString('ar-EG'));document.getElementById('adMedia').addEventListener('change',event=>{const file=event.target.files[0];if(file){document.getElementById('adUploadTitle').textContent=file.name;document.getElementById('adUploadHint').textContent='تم اختيار الملف بنجاح';document.getElementById('adUploadZone').classList.add('has-file')}});
    document.querySelectorAll('.ad-placement-grid button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.ad-placement-grid button').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');updateCost()}));packageSelect.addEventListener('change',updateCost);
    document.getElementById('saveAdDraft').addEventListener('click',()=>{localStorage.setItem('saey_ad_draft',JSON.stringify(collectAd()));feedback.className='ad-editor-feedback success';feedback.textContent='تم حفظ الإعلان كمسودة ويمكن استكماله لاحقًا'});
    document.getElementById('reviewAd').addEventListener('click',()=>{const ad=collectAd();if(!ad.title||!ad.date||!ad.time){feedback.className='ad-editor-feedback error';feedback.textContent='أكمل عنوان الإعلان وتاريخ ووقت البدء أولًا';return}localStorage.setItem('saey_ad_review',JSON.stringify(ad));location.href='19-ad-review.html'});if(savedDraft&&new URLSearchParams(location.search).has('draft')){titleInput.value=savedDraft.title||'';document.getElementById('adTitleCount').textContent=titleInput.value.length.toLocaleString('ar-EG');document.getElementById('adStartDate').value=savedDraft.date||'';document.getElementById('adStartTime').value=savedDraft.time||'';document.querySelectorAll('.ad-placement-grid button').forEach(button=>button.classList.toggle('selected',button.dataset.placement===savedDraft.placement));const matchingOption=[...packageSelect.options].find(option=>option.text===savedDraft.package);if(matchingOption)packageSelect.value=matchingOption.value}updateCost();
  </script>
</body>
</html>
