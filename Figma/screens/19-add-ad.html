<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — إضافة إعلان</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="trader.css"></head>
<body class="ad-editor-page">
  <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div>
  <main class="ad-editor-shell">
    <header class="ad-editor-header"><a href="19-distributor-ads.html" aria-label="العودة إلى الإعلانات"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div><small>إنشاء حملة</small><h1>إعلان جديد</h1></div><span class="ad-editor-state">مسودة</span></header>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></span><div><h2>محتوى الإعلان</h2><p>العنوان والصورة التي ستظهر للعملاء</p></div></header><label class="ad-editor-field"><span>عنوان الإعلان <b>*</b></span><input id="adTitle" maxlength="60" placeholder="مثال: خصم ٢٥٪ على منتجات الصيف"><small><i id="adTitleCount">٠</i> / ٦٠</small></label><label class="ad-upload-zone" id="adUploadZone"><input id="adMedia" type="file" accept="image/png,image/jpeg,video/mp4"><span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="m7 16 4-4 3 3 2-2 3 3"/><circle cx="9" cy="9" r="1.5"/></svg></span><strong id="adUploadTitle">أضف صورة أو فيديو</strong><small id="adUploadHint">JPG أو PNG أو MP4 · حتى ٢٠ ميجابايت</small></label></section>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><path d="m4 12 15-7v14L4 12Z"/><path d="M4 12v5a2 2 0 0 0 2 2"/></svg></span><div><h2>مكان الظهور</h2><p>حدد أين تريد عرض حملتك</p></div></header><div class="ad-placement-grid" role="radiogroup" aria-label="مكان ظهور الإعلان"><button class="selected" type="button" data-placement="داخل القسم" data-extra="0"><i><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM8 9h8M8 13h5"/></svg></i><span><strong>داخل القسم</strong><small>استهداف أدق</small></span><b>مدفوع</b></button><button type="button" data-placement="التطبيق كله" data-extra="0"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></i><span><strong>التطبيق كله</strong><small>وصول أكبر</small></span><b>مدفوع</b></button><button type="button" data-placement="صفحة متجري" data-extra="free"><i><svg viewBox="0 0 24 24"><path d="M4 10h16v10H4zM6 10V6h12v4"/></svg></i><span><strong>صفحة متجري</strong><small>لزوّار متجرك</small></span><b class="free">مجاني</b></button></div></section>
    <section class="ad-editor-card"><header><span><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span><div><h2>الباقة والموعد</h2><p>اختر مدة الحملة ووقت بدايتها</p></div></header><label class="ad-editor-field"><span>الباقة</span><select id="adPackage"><option value="1" data-cost="350">ظهور مميز · ٧ أيام · ٣٥٠ ج.م</option><option value="2" data-cost="150">ظهور قياسي · ٣ أيام · ١٥٠ ج.م</option></select></label><div class="ad-schedule-grid"><label class="ad-editor-field"><span>تاريخ البدء</span><input id="adStartDate" type="date"></label><label class="ad-editor-field"><span>وقت البدء</span><input id="adStartTime" type="time"></label></div></section>
    <section class="ad-budget-summary"><span><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM16 11h5v4h-5z"/><path d="M6 7V5h12v2"/></svg></span><div><small>تكلفة الحملة المتوقعة</small><strong id="campaignCost">٣٥٠ ج.م</strong><p id="walletAfterPayment">رصيد المحفظة بعد الدفع: ١,٨٩٠ ج.م</p></div><i>الرصيد كافٍ</i></section>
    <section class="ad-payment-method-card" aria-labelledby="adPaymentMethodTitle"><strong id="adPaymentMethodTitle">طريقة الدفع عند الإرسال للمراجعة</strong><div class="ad-payment-method-options" role="radiogroup" aria-label="طريقة الدفع"><button class="selected" type="button" role="radio" aria-checked="true" data-payment-method="wallet"><span>المحفظة</span><small>الدفع من رصيد المتجر</small></button><button type="button" role="radio" aria-checked="false" data-payment-method="online"><span>دفع إلكتروني</span><small>افتح صفحة الدفع الآمنة</small></button></div></section>
    <p class="ad-editor-feedback" id="adEditorFeedback" role="alert"></p>
  </main>
  <footer class="ad-editor-actions"><button class="ad-save-draft" id="saveAdDraft" type="button">حفظ كمسودة</button><button class="ad-review-button" id="reviewAd" type="button">دفع وإرسال للمراجعة <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button></footer>
  <script>
    const titleInput = document.getElementById('adTitle');
    const packageSelect = document.getElementById('adPackage');
    const feedback = document.getElementById('adEditorFeedback');
    let walletBalance = 0;
    let campaignCost = 350;
    let adPricing = { home: null, category: null };
    let pricingLoaded = false;
    let paymentMethod = 'wallet';
    let editedPackageId = null;
    const savedDraft = JSON.parse(localStorage.getItem('saey_ad_draft') || 'null');
    const adApiToken = localStorage.getItem('saey_api_token');
    const adApiBase = localStorage.getItem('saey_api_base') || '/api/store';
    const generalApiBase = adApiBase.replace(/\/store\/?$/, '');
    const editId = new URLSearchParams(location.search).get('edit');

    const apiRequest = async (path, options = {}, baseUrl = adApiBase) => {
      const headers = {
        Accept: 'application/json',
        'Accept-Language': document.documentElement.lang || 'ar',
        ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
        ...(adApiToken ? { Authorization: `Bearer ${adApiToken}` } : {}),
        ...(options.headers || {}),
      };
      const response = await fetch(`${baseUrl}${path}`, { ...options, headers });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || 'تعذر حفظ الإعلان. تحقق من البيانات وحاول مرة أخرى.');
      return payload;
    };

    const placementApiValue = value => ({ 'داخل القسم': 'category', 'التطبيق كله': 'home', 'صفحة متجري': 'storefront' })[value] || 'home';
    const selectedPlacement = () => document.querySelector('.ad-placement-grid button.selected');
    const updateCost = () => {
      const extra = selectedPlacement().dataset.extra;
      const placement = placementApiValue(selectedPlacement().dataset.placement);
      const configuredPrice = adPricing[placement];
      const packagePrice = Number(packageSelect.options[packageSelect.selectedIndex]?.dataset.cost || 0);
      campaignCost = extra === 'free' ? 0 : (configuredPrice ?? packagePrice);
      document.getElementById('campaignCost').textContent = campaignCost ? `${campaignCost.toLocaleString('ar-EG')} ج.م` : 'مجاني';
      document.getElementById('walletAfterPayment').textContent = campaignCost
        ? `رصيد المحفظة بعد الدفع: ${(walletBalance - campaignCost).toLocaleString('ar-EG')} ج.م`
        : 'لن يتم خصم أي مبلغ من المحفظة';
      const balanceBadge = document.querySelector('.ad-budget-summary > i');
      const hasEnoughBalance = campaignCost === 0 || walletBalance >= campaignCost;
      balanceBadge.textContent = campaignCost === 0 ? 'مجاني' : (hasEnoughBalance ? 'الرصيد كافٍ' : 'الرصيد غير كافٍ');
      balanceBadge.classList.toggle('insufficient', !hasEnoughBalance);
    };
    const collectAd = () => ({
      title: titleInput.value.trim(),
      placement: selectedPlacement().dataset.placement,
      package: packageSelect.options[packageSelect.selectedIndex].text,
      packageId: packageSelect.value,
      cost: campaignCost,
      date: document.getElementById('adStartDate').value,
      time: document.getElementById('adStartTime').value,
    });
    const buildAdBody = submissionAction => {
      const body = new FormData();
      const media = document.getElementById('adMedia').files[0];
      if (!editId) body.append('ad_package_id', packageSelect.value);
      body.append('title', titleInput.value.trim());
      if (!editId || selectedPlacement()) body.append('placement', placementApiValue(selectedPlacement().dataset.placement));
      if (!editId) body.append('action', 'view_product');
      if (!editId) body.append('media_type', media?.type.startsWith('video/') ? 'video' : 'image');
      if (!editId && submissionAction) body.append('submission_action', submissionAction);
      if (!editId && submissionAction === 'submit_for_review') body.append('payment_method', paymentMethod);
      if (!editId && submissionAction === 'submit_for_review') {
        const storageKey = 'saey_ad_submission_key';
        let key = localStorage.getItem(storageKey);
        if (!key) {
          key = crypto.randomUUID();
          localStorage.setItem(storageKey, key);
        }
        body.append('idempotency_key', key);
      }
      if (media) {
        if (editId) body.append('media_type', media.type.startsWith('video/') ? 'video' : 'image');
        body.append('media', media);
      }
      const date = document.getElementById('adStartDate').value;
      const time = document.getElementById('adStartTime').value;
      if (date && time) body.append('starts_at', `${date}T${time}:00`);
      return body;
    };
    const setFeedback = (message, state = 'error') => {
      feedback.className = `ad-editor-feedback ${state}`;
      feedback.textContent = message;
    };
    const saveAd = async submissionAction => {
      const ad = collectAd();
      if (!ad.title) throw new Error('أدخل عنوان الإعلان أولًا');
      if (adApiToken && submissionAction === 'submit_for_review' && !pricingLoaded) throw new Error('تعذر تحميل أسعار الإعلانات. أعد المحاولة قبل الدفع.');
      const media = document.getElementById('adMedia').files[0];
      if (!editId && !media) throw new Error('أضف صورة أو فيديو للإعلان أولًا');
      if (adApiToken) {
        const body = buildAdBody(submissionAction);
        if (editId) body.append('_method', 'PATCH');
        return apiRequest(editId ? `/ads/${editId}` : '/ads', { method: 'POST', body });
      }
      localStorage.setItem('saey_ad_draft', JSON.stringify({ ...ad, submissionAction }));
      return { data: { id: editId || null } };
    };

    titleInput.addEventListener('input', () => {
      document.getElementById('adTitleCount').textContent = titleInput.value.length.toLocaleString('ar-EG');
    });
    document.getElementById('adMedia').addEventListener('change', event => {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('adUploadTitle').textContent = file.name;
        document.getElementById('adUploadHint').textContent = 'تم اختيار الملف بنجاح';
        document.getElementById('adUploadZone').classList.add('has-file');
      }
    });
    document.querySelectorAll('.ad-placement-grid button').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.ad-placement-grid button').forEach(item => item.classList.remove('selected'));
      button.classList.add('selected');
      packageSelect.disabled = button.dataset.extra === 'free';
      updateCost();
    }));
    packageSelect.addEventListener('change', updateCost);
    document.querySelectorAll('.ad-payment-method-options button').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.ad-payment-method-options button').forEach(option => {
        const selected = option === button;
        option.classList.toggle('selected', selected);
        option.setAttribute('aria-checked', String(selected));
      });
      paymentMethod = button.dataset.paymentMethod;
    }));

    document.getElementById('saveAdDraft').addEventListener('click', async () => {
      try {
        await saveAd('save_as_draft');
        if (!editId) localStorage.removeItem('saey_ad_submission_key');
        if (!adApiToken) localStorage.setItem('saey_ad_draft', JSON.stringify(collectAd()));
        location.href = '19-distributor-ads.html';
      } catch (error) {
        setFeedback(error.message);
      }
    });
    document.getElementById('reviewAd').addEventListener('click', async () => {
      try {
        let result = await saveAd('submit_for_review');
        if (editId && adApiToken) {
          result = await apiRequest(`/ads/${editId}/submit`, {
            method: 'POST',
            body: JSON.stringify({ payment_method: paymentMethod }),
          });
        }
        if (result.data?.redirectUrl) {
          location.href = result.data.redirectUrl;
          return;
        }
        localStorage.removeItem('saey_ad_submission_key');
        location.href = '19-distributor-ads.html';
      } catch (error) {
        setFeedback(error.message);
      }
    });

    if (savedDraft && new URLSearchParams(location.search).has('draft')) {
      titleInput.value = savedDraft.title || '';
      document.getElementById('adTitleCount').textContent = titleInput.value.length.toLocaleString('ar-EG');
      document.getElementById('adStartDate').value = savedDraft.date || '';
      document.getElementById('adStartTime').value = savedDraft.time || '';
      document.querySelectorAll('.ad-placement-grid button').forEach(button => button.classList.toggle('selected', button.dataset.placement === savedDraft.placement));
      const matchingOption = [...packageSelect.options].find(option => option.text === savedDraft.package);
      if (matchingOption) packageSelect.value = matchingOption.value;
    }
    if (editId && adApiToken) {
      apiRequest(`/ads/${editId}`).then(result => {
        const ad = result.data || {};
        titleInput.value = ad.title || '';
        document.getElementById('adTitleCount').textContent = titleInput.value.length.toLocaleString('ar-EG');
        editedPackageId = String(ad.ad_package_id);
        packageSelect.value = editedPackageId;
        const placementLabel = ({ category: 'داخل القسم', home: 'التطبيق كله', storefront: 'صفحة متجري' })[ad.placement];
        document.querySelectorAll('.ad-placement-grid button').forEach(button => button.classList.toggle('selected', button.dataset.placement === placementLabel));
        if (ad.starts_at) {
          const start = new Date(ad.starts_at);
          document.getElementById('adStartDate').value = start.toISOString().slice(0, 10);
          document.getElementById('adStartTime').value = start.toISOString().slice(11, 16);
        }
        document.querySelector('.ad-editor-header h1').textContent = 'تعديل الإعلان';
        document.querySelector('.ad-editor-header small').textContent = 'تحديث الحملة';
      }).catch(error => setFeedback(error.message));
    }
    if (adApiToken) {
      Promise.all([apiRequest('/ad-packages'), apiRequest('/settings', {}, generalApiBase)]).then(([packages, settings]) => {
        const selected = editedPackageId || packageSelect.value;
        packageSelect.replaceChildren();
        (packages.data || []).forEach(pkg => {
          const option = document.createElement('option');
          option.value = pkg.id;
          option.dataset.cost = pkg.price;
          option.textContent = `${pkg.name} · ${pkg.duration_days} أيام`;
          packageSelect.append(option);
        });
        if ([...packageSelect.options].some(option => option.value === selected)) packageSelect.value = selected;
        editedPackageId = null;
        adPricing = {
          home: settings.data?.ad_pricing?.home == null ? null : Number(settings.data.ad_pricing.home),
          category: settings.data?.ad_pricing?.category == null ? null : Number(settings.data.ad_pricing.category),
        };
        pricingLoaded = true;
        updateCost();
      }).catch(error => setFeedback(error.message));

      apiRequest('/ads/wallet-balance').then(wallet => {
        walletBalance = Number(wallet.data?.balance || 0);
        updateCost();
      }).catch(error => setFeedback(error.message));
    }
    updateCost();
  </script>
</body>
</html>
