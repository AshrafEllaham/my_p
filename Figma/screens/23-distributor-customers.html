<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — إدارة العملاء</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"><link rel="stylesheet" href="merchant-ui-states.css"></head><body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div><main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="20-distributor-account.html" aria-label="العودة للحساب"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>إدارة العملاء</h1><p>اعرف عملاءك الأكثر قيمة</p></div><span></span></header><section class="ops-summary"><article class="ops-card"><span><i></i>إجمالي العملاء</span><strong>١٬٢٤٨</strong></article><article class="ops-card"><span><i></i>متكررون</span><strong>٤٢٪</strong></article><article class="ops-card"><span><i></i>جدد هذا الشهر</span><strong>٨٧</strong></article></section><div class="ops-toolbar"><label class="ops-search"><svg class="ops-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="customerSearch" type="search" placeholder="ابحث باسم العميل أو الهاتف"></label><select class="ops-filter" id="customerFilter"><option value="all">الكل</option><option value="vip">الأعلى إنفاقًا</option><option value="repeat">متكررون</option><option value="new">جدد</option></select></div><section class="bo-list" id="customersList"></section></main>
<div class="sheet-backdrop" id="customerSheet" aria-hidden="true"><section class="ops-sheet"><div class="sheet-handle"></div><header class="ops-sheet-head"><h2 id="sheetCustomerName">تفاصيل العميل</h2><button data-close aria-label="إغلاق">×</button></header><p id="sheetCustomerPhone"></p><div class="decision-box"><span>إجمالي مشتريات العميل</span><strong id="sheetCustomerSpend"></strong></div><div class="permission-grid" id="customerHistory"></div><a class="primary-action" id="customerChat" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="14-chat-conversation.html">دردشة العميل</a></section></div>
<script src="merchant-ui-states.js"></script><script>
const customers=[{id:'c1',name:'سارة أحمد',phone:'+20 100 245 8391',orders:8,spend:12450,last:'اليوم',type:'vip',history:['#SA-10928 · جاكيت جلد طبيعي','#SA-10812 · حذاء رياضي أبيض']},{id:'c2',name:'محمود علي',phone:'+20 112 640 2874',orders:5,spend:8600,last:'اليوم',type:'repeat',history:['#SA-10914 · ساعة رياضية ذكية','#SA-10682 · حقيبة ظهر عملية']},{id:'c3',name:'نورهان حسن',phone:'+20 101 582 9036',orders:3,spend:2940,last:'أمس',type:'repeat',history:['#SA-10886 · حقيبة ظهر عملية']},{id:'c4',name:'ريم خالد',phone:'+20 122 681 4432',orders:1,spend:950,last:'منذ ٣ أيام',type:'new',history:['#SA-10794 · حذاء رياضي أبيض']}];const money=v=>`${v.toLocaleString('ar-EG')} ج.م`;
function render(){const q=customerSearch.value.trim(),f=customerFilter.value,items=customers.filter(c=>(!q||`${c.name} ${c.phone}`.includes(q))&&(f==='all'||c.type===f));customersList.innerHTML=items.map(c=>`<article class="customer-card ops-card" data-customer="${c.id}" role="button" tabindex="0"><span class="customer-avatar-lg">${c.name[0]}</span><div><h3>${c.name}</h3><p>${c.phone} · آخر طلب ${c.last}</p><div class="customer-tags"><span>${c.orders.toLocaleString('ar-EG')} طلبات</span>${c.type==='vip'?'<span class="vip">عميل مميز</span>':c.type==='new'?'<span>عميل جديد</span>':'<span>متكرر</span>'}</div></div><div class="customer-value"><strong>${money(c.spend)}</strong><span>إجمالي الإنفاق</span></div></article>`).join('');if(!items.length)customersList.innerHTML='<div class="empty-state ops-card"><h3>لا توجد نتائج</h3><p>جرّب تغيير البحث أو الفلتر.</p></div>';document.querySelectorAll('[data-customer]').forEach(card=>{const open=()=>showCustomer(customers.find(c=>c.id===card.dataset.customer));card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter')open()}})}function showCustomer(c){sheetCustomerName.textContent=c.name;sheetCustomerPhone.textContent=c.phone;sheetCustomerSpend.textContent=money(c.spend);customerHistory.innerHTML=c.history.map(x=>`<div class="permission-row"><div><h3>${x}</h3><p>طلب مكتمل</p></div><span class="bo-status completed">مكتمل</span></div>`).join('');customerChat.href=`14-chat-conversation.html?store=${encodeURIComponent(c.name)}`;customerSheet.classList.add('visible');customerSheet.setAttribute('aria-hidden','false')}function close(){customerSheet.classList.remove('visible');customerSheet.setAttribute('aria-hidden','true')}customerSheet.querySelector('[data-close]').onclick=close;customerSheet.onclick=e=>{if(e.target===customerSheet)close()};customerSearch.oninput=render;customerFilter.onchange=render;render();
</script></body></html>
