<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — الموظفون والصلاحيات</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"><link rel="stylesheet" href="merchant-ui-states.css"></head><body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div><main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="20-distributor-account.html" aria-label="العودة للحساب"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>الموظفون والصلاحيات</h1><p>تحكم في وصول فريق المتجر</p></div><button class="ops-icon-button" id="openInvite" aria-label="إضافة موظف"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header><section class="ops-intro"><div><h2>فريق المتجر</h2><p>كل موظف يرى الأدوات المصرح بها فقط.</p></div><span class="bo-status completed" id="activeTeamCount">—</span></section><section class="bo-list" id="teamList"></section></main>
<div class="sheet-backdrop" id="teamSheet" aria-hidden="true"><section class="ops-sheet"><div class="sheet-handle"></div><header class="ops-sheet-head"><h2 id="teamSheetTitle">دعوة موظف</h2><button data-close aria-label="إغلاق">×</button></header><p>أدخل بيانات الموظف وحدد صلاحيات العمل.</p><label class="form-field"><span>اسم الموظف</span><input id="memberName" type="text" placeholder="الاسم الكامل"></label><label class="form-field"><span>رقم الهاتف</span><input id="memberPhone" type="tel" dir="ltr" placeholder="+20 100 000 0000"></label><label class="form-field"><span>الدور الوظيفي</span><select id="memberRole"><option>مدير المتجر</option><option>مسؤول الطلبات</option><option>مسؤول المخزون</option><option>محاسب</option></select></label><div class="permission-grid"><label class="permission-row"><div><h3>إدارة الطلبات</h3><p>تأكيد وتجهيز وإكمال الطلبات</p></div><input class="check-toggle" type="checkbox" value="orders" checked></label><label class="permission-row"><div><h3>إدارة المنتجات والمخزون</h3><p>تعديل المنتجات والكميات</p></div><input class="check-toggle" type="checkbox" value="inventory"></label><label class="permission-row"><div><h3>المالية والتقارير</h3><p>عرض الأرباح والتسويات</p></div><input class="check-toggle" type="checkbox" value="finance"></label></div><p class="sheet-error" id="teamError"></p><button class="primary-action" id="saveMember">إرسال الدعوة</button></section></div><div class="ops-toast" id="toast"></div>
<script src="merchant-state.js"></script><script src="merchant-ui-states.js"></script><script>
const seed=[{id:'tm1',name:'محمد حسن',phone:'+20 100 582 1120',role:'مدير المتجر',permissions:['orders','inventory','finance'],active:true},{id:'tm2',name:'آية محمود',phone:'+20 115 302 8419',role:'مسؤول الطلبات',permissions:['orders'],active:true},{id:'tm3',name:'عمر طارق',phone:'+20 122 903 7611',role:'مسؤول المخزون',permissions:['inventory'],active:false}],key='saey_merchant_team_v1';let members;try{members=JSON.parse(localStorage.getItem(key))||seed}catch(e){members=seed}const save=()=>localStorage.setItem(key,JSON.stringify(members));
function render(){activeTeamCount.textContent=`${members.filter(x=>x.active).length.toLocaleString('ar-EG')} نشط`;teamList.innerHTML=members.map(m=>`<article class="team-card ops-card"><div class="team-main"><span class="customer-avatar-lg">${m.name[0]}</span><div><h3>${m.name}</h3><p>${m.phone}</p></div><button class="switch ${m.active?'active':''}" data-toggle="${m.id}" aria-label="${m.active?'إيقاف':'تفعيل'} ${m.name}"></button></div><div class="team-role"><span>${m.role}</span><strong>${m.permissions.length.toLocaleString('ar-EG')} صلاحيات</strong></div></article>`).join('');if(!members.length)teamList.innerHTML='<div class="empty-state ops-card"><h3>لا يوجد موظفون بعد</h3><p>أضف أول موظف وحدد صلاحياته.</p></div>';document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const m=members.find(x=>x.id===b.dataset.toggle);if(m.active){const ok=await SaeyUI.confirm({title:'إيقاف الموظف؟',message:'سيفقد '+m.name+' الوصول إلى أدوات المتجر حتى إعادة تفعيله.',confirmLabel:'إيقاف الوصول',danger:true});if(!ok)return}m.active=!m.active;save();SaeyMerchant.addActivity({type:'team',title:(m.active?'تم تفعيل ':'تم إيقاف ')+m.name,detail:m.role});render();SaeyUI.success(m.active?'تم تفعيل الموظف':'تم إيقاف وصول الموظف')})}function openSheet(){memberName.value='';memberPhone.value='';teamError.textContent='';document.querySelectorAll('.check-toggle').forEach((x,i)=>x.checked=i===0);teamSheet.classList.add('visible');teamSheet.setAttribute('aria-hidden','false')}function close(){teamSheet.classList.remove('visible');teamSheet.setAttribute('aria-hidden','true')}openInvite.onclick=openSheet;teamSheet.querySelector('[data-close]').onclick=close;teamSheet.onclick=e=>{if(e.target===teamSheet)close()};saveMember.onclick=()=>{const name=memberName.value.trim(),phone=memberPhone.value.trim(),permissions=[...document.querySelectorAll('.check-toggle:checked')].map(x=>x.value);if(!name||phone.length<8||!permissions.length){teamError.textContent='أكمل البيانات وحدد صلاحية واحدة على الأقل.';return}members.unshift({id:`tm${Date.now()}`,name,phone,role:memberRole.value,permissions,active:true});save();SaeyMerchant.addActivity({type:'team',title:'تمت دعوة موظف جديد',detail:name});close();render();SaeyUI.success('تم إرسال دعوة الموظف')};render();
</script></body></html>
