<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>سعي — المحادثة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="chat-conversation.css">
  <link rel="stylesheet" href="uber-ui.css">
</head>
<body class="saey-conversation">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x=".75" y=".75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2V5.2A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="conversation-page">
    <header class="conversation-head">
      <a class="conversation-back" href="14-chats.html" aria-label="العودة للدردشات"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <span class="conversation-avatar"><img id="storeAvatar" alt="" hidden><span class="conversation-avatar-fallback" id="storeAvatarFallback" aria-hidden="true">م</span></span>
      <div class="conversation-identity"><strong id="storeName">المتجر</strong><span>محادثة خاصة مع المتجر</span></div>
      <button class="conversation-menu" id="conversationMenu" type="button" aria-label="خيارات المحادثة">⋮</button>
    </header>

    <label class="message-search" for="messageSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="messageSearch" type="search" placeholder="ابحث في الرسائل"></label>
    <button class="older-messages" id="loadOlderMessages" type="button" hidden>عرض رسائل أقدم</button>

    <section class="messages" id="messages" aria-label="رسائل المحادثة" aria-live="polite"></section>
    <section class="conversation-loading" id="messagesLoading" hidden>جارٍ تحميل الرسائل...</section>
    <section class="conversation-error" id="messagesError" hidden><span id="messagesErrorText"></span><button type="button" id="retryMessages">إعادة المحاولة</button></section>
    <p class="conversation-status" id="conversationStatus" role="status" hidden></p>
  </main>

  <form class="message-composer" id="messageComposer">
    <input id="messageInput" type="text" placeholder="اكتب رسالتك..." autocomplete="off" maxlength="5000" disabled>
    <button class="send-button" type="submit" aria-label="إرسال الرسالة" disabled><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </form>
  <dialog class="conversation-actions" id="conversationActions"><form method="dialog"><h2>خيارات المحادثة</h2><button value="block" id="blockConversation">حظر المحادثة</button><button value="report" id="reportConversation">الإبلاغ عن المحادثة</button><button value="cancel">إلغاء</button></form></dialog>
  <dialog class="report-dialog" id="reportDialog"><form id="reportForm"><h2>الإبلاغ عن المحادثة</h2><label for="reportReason">سبب الإبلاغ</label><input id="reportReason" name="reason" required maxlength="120" value="محتوى غير مناسب"><label for="reportDetails">تفاصيل إضافية (اختياري)</label><textarea id="reportDetails" name="details" maxlength="1000"></textarea><p id="reportError" role="alert" hidden></p><div><button type="button" id="cancelReport">إلغاء</button><button type="submit">إرسال البلاغ</button></div></form></dialog>

  <script src="chat-reverb.js"></script>
  <script src="chat-api.js"></script>
</body>
</html>
