<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>سعي — المحادثة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="chat-conversation.css">
</head>
<body class="saey-conversation">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x=".75" y=".75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2-1.2V5.2A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>

  <main class="conversation-page">
    <header class="conversation-head">
      <a class="conversation-back" href="14-chats.html" aria-label="العودة للدردشات"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <span class="conversation-avatar"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=120&q=85" alt="نقطة ستور"><i></i></span>
      <div class="conversation-identity"><strong id="storeName">نقطة ستور</strong><span><i></i>متصل الآن</span></div>
    </header>

    <section class="conversation-product" aria-label="المنتج المرتبط بالمحادثة">
      <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=180&q=85" alt="جاكيت جلد طبيعي">
      <div><small>استفسار عن المنتج</small><strong>جاكيت جلد طبيعي رجالي</strong><span>٢,٨٩٠ ج.م · مقاس M</span></div>
      <a href="12-product-details.html" aria-label="عرض تفاصيل المنتج"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
    </section>

    <section class="messages" aria-label="رسائل المحادثة">
      <div class="date-divider"><span>اليوم</span></div>
      <div class="message incoming"><p>أهلًا بك في نقطة ستور، كيف نقدر نساعدك؟</p><time>10:28 ص</time></div>
      <div class="message outgoing"><p>هل الجاكيت متوفر بالمقاس M؟ وهل يمكن الاستلام من المتجر؟</p><time>10:30 ص <b>✓✓</b></time></div>
      <div class="message incoming"><p>نعم، المقاس M متوفر ويمكنك الاستلام من المتجر اليوم.</p><time>10:32 ص</time></div>
    </section>
  </main>

  <form class="message-composer" id="messageComposer">
    <button class="attach-button" type="button" aria-label="إرفاق ملف"><svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
    <input id="messageInput" type="text" placeholder="اكتب رسالتك..." autocomplete="off">
    <button class="send-button" type="submit" aria-label="إرسال الرسالة"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
  </form>

  <script>
    const params = new URLSearchParams(window.location.search);
    const storeName = params.get('store');
    if (storeName) document.getElementById('storeName').textContent = storeName;

    const composer = document.getElementById('messageComposer');
    const input = document.getElementById('messageInput');
    const messages = document.querySelector('.messages');
    composer.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      const message = document.createElement('div');
      message.className = 'message outgoing';
      message.innerHTML = `<p>${value.replace(/[&<>]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[char]))}</p><time>الآن <b>✓</b></time>`;
      messages.appendChild(message);
      input.value = '';
      message.scrollIntoView({ behavior: 'smooth', block: 'end' });
    });
  </script>
</body>
</html>
