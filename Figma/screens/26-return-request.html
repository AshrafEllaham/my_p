<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — طلب استرجاع</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="user-flows.css"><link rel="stylesheet" href="user-experience.css"></head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div>
<main class="flow-page has-sticky-action"><header class="flow-head"><a class="flow-back" id="backLink" href="21-order-details.html" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>طلب استرجاع</h1><span></span></header><section class="flow-card"><h2>المنتج المطلوب استرجاعه</h2><div class="flow-product"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=240&q=85" alt="المنتج"><div><strong id="productName">فستان نسائي أنيق</strong><small id="orderCode">#SA-1014 · الكمية ١</small></div><b id="refundAmount">١٩٠ ج.م</b></div></section><section class="flow-card"><h2>تفاصيل الطلب</h2><div class="form-stack"><label><span>سبب الاسترجاع</span><select id="returnReason"><option value="">اختر السبب</option><option>المنتج لا يطابق الوصف</option><option>عيب في المنتج</option><option>تم استلام منتج مختلف</option><option>تراجع عن الشراء</option></select></label><label><span>تفاصيل إضافية</span><textarea id="returnDetails" placeholder="اشرح المشكلة لمساعدة المتجر على مراجعة الطلب"></textarea></label><label class="upload-box"><input id="returnPhotos" type="file" accept="image/*" multiple><span><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4Z"/><path d="m4 15 4-4 4 4 3-3 5 5M16 9h.01"/></svg><strong id="photoLabel">إرفاق صور للمنتج</strong><small>حتى ٣ صور — اختياري</small></span></label></div></section><section class="flow-card"><h2>المبلغ المتوقع</h2><div class="flow-row"><span>قيمة المنتج</span><strong id="summaryAmount">١٩٠ ج.م</strong></div><div class="flow-row"><span>طريقة الاسترداد</span><strong>محفظة سعي</strong></div><p class="coupon-help">يُعاد المبلغ بعد قبول الطلب واستلام المتجر للمنتج.</p></section><div class="flow-sticky-action"><p class="flow-error" id="returnError" hidden></p><button class="flow-primary" id="submitReturn">إرسال طلب الاسترجاع</button></div></main>
<script src="user-state.js"></script><script src="user-experience.js"></script><script>
const params=new URLSearchParams(location.search),code=params.get('code')||'SA-1014',latest=SaeyState.read('saey_latest_order',null),order=latest&&latest.code===code?latest:{product:'فستان نسائي أنيق',total:190,qty:1};const money=v=>`${Number(v).toLocaleString('ar-EG')} ج.م`;backLink.href=`21-order-details.html?code=${code}&state=completed`;productName.textContent=order.product;orderCode.textContent=`#${code} · الكمية ${Number(order.qty||1).toLocaleString('ar-EG')}`;refundAmount.textContent=summaryAmount.textContent=money(order.total);returnPhotos.onchange=()=>{const count=Math.min(returnPhotos.files.length,3);photoLabel.textContent=count?`تم اختيار ${count.toLocaleString('ar-EG')} صور`:'إرفاق صور للمنتج'};submitReturn.onclick=()=>{const reason=returnReason.value,details=returnDetails.value.trim();if(!reason||details.length<10){returnError.textContent='اختر سبب الاسترجاع واكتب تفاصيل لا تقل عن ١٠ أحرف.';returnError.hidden=false;return}submitReturn.disabled=true;submitReturn.textContent='جارٍ إرسال الطلب…';const request=SaeyState.createReturn({order:code,product:order.product,amount:Number(order.total),reason,details,photoCount:Math.min(returnPhotos.files.length,3)});setTimeout(()=>location.href=`26-return-status.html?code=${code}&submitted=1`,450)};
