erience.css"></head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="flow-page"><header class="flow-head"><a class="flow-back" href="08-user-home.html"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>نتائج البحث</h1><span></span></header><label class="search-box"><input id="searchQuery" type="search" placeholder="ابحث عن منتج"></label><section class="result-list" id="results" aria-live="polite"></section><button id="loadMoreProducts" type="button" hidden style="width:100%;height:48px;margin-top:12px;border:1px solid #E1E8F1;border-radius:10px;background:#FFF;font:800 12px Cairo,sans-serif">عرض المزيد</button><div class="result-empty" id="empty" hidden>لا توجد نتائج مطابقة. جرّب كلمة بحث أخرى.</div><div class="result-loading" id="searchLoading" hidden><i></i>جارٍ البحث...</div><div class="result-error" id="searchError" hidden><strong>تعذر تحميل نتائج البحث</strong><br><button type="button" id="retrySearch">إعادة المحاولة</button></div></main><script src="user-product-results.js"></script><script src="user-experience.js"></script></body></html>
