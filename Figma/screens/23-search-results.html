uct">المنتجات</button><button data-type="store">المتاجر</button></div><section class="result-list" id="results"><a class="result-item" data-type="product" data-search="جاكيت جلد طبيعي ملابس" href="12-product-details.html"><img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=240&q=85" alt="جاكيت"><div><strong>جاكيت جلد طبيعي</strong><small>نقطة ستور · ملابس</small><b>٢,٨٩٠ ج.م</b></div></a><a class="result-item" data-type="product" data-search="سماعة لاسلكية إلكترونيات" href="12-product-details.html"><img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=240&q=85" alt="سماعة"><div><strong>سماعة لاسلكية</strong><small>التقنية الحديثة · إلكترونيات</small><b>٢,٣٥٠ ج.م</b></div></a><a class="result-item" data-type="store" data-search="نقطة ستور ملابس" href="19-store-details.html"><img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=240&q=85" alt="متجر"><div><strong>نقطة ستور</strong><small>أزياء رجالية · 4.9 ★</small><b>عرض المتجر</b></div></a></section><div class="result-empty" id="empty" hidden>لا توجد نتائج مطابقة. جرّب كلمة بحث أخرى.</div></main><script>const input=document.getElementById('searchQuery'),items=[...document.querySelectorAll('.result-item')],empty=document.getElementById('empty');let type='all';input.value=new URLSearchParams(location.search).get('q')||'';const filter=()=>{let shown=0,q=input.value.trim().toLowerCase();items.forEach(item=>{const visible=(type==='all'||item.dataset.type===type)&&(!q||item.dataset.search.toLowerCase().includes(q));item.hidden=!visible;if(visible)shown++;});empty.hidden=shown>0;};input.oninput=filter;document.querySelectorAll('.result-tabs button').forEach(button=>button.onclick=()=>{type=button.dataset.type;document.querySelectorAll('.result-tabs button').forEach(item=>item.classList.toggle('active',item===button));filter();});filter();</script></body></html>
