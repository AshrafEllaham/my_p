ect">عنوان الرسالة</label><input class="view-input" id="contactSubject" type="text" required></div><div class="view-field"><label class="view-label" for="contactMessage">الرسالة</label><textarea class="view-textarea" id="contactMessage" placeholder="اكتب تفاصيل طلبك أو استفسارك" required></textarea></div><p class="view-message" id="contactStatus" hidden></p><button class="view-button" type="submit">إرسال الرسالة</button></form></main><script>document.getElementById('contactForm').onsubmit=event=>{event.preventDefault();const status=document.getElementById('contactStatus'),message=document.getElementById('contactMessage').value.trim();if(message.length<10){status.textContent='اكتب تفاصيل أكثر عن طلبك.';status.className='view-message error';status.hidden=false;return;}localStorage.setItem('saey_last_support_message',JSON.stringify({name:document.getElementById('contactName').value,email:document.getElementById('contactEmail').value,subject:document.getElementById('contactSubject').value,message,date:new Date().toISOString()}));status.textContent='تم إرسال رسالتك، وسنتواصل معك قريبًا.';status.className='view-message success';status.hidden=false;event.currentTarget.reset();};</script></body></html>
