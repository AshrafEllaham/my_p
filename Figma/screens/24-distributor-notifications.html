<script src="merchant-ui-states.js"></script><script>
const stored=JSON.parse(localStorage.getItem('saey_merchant_notifications_v1')||'[]').map(n=>({...n,time:'الآن',icon:'<path d="M6 4h12l1 16H5L6 4ZM9 8a3 3 0 0 0 6 0"/>'}));const seed=[...stored,{id:'n1',type:'orders',title:'طلب جديد يحتاج تأكيدك',text:'سارة أحمد طلبت جاكيت جلد طبيعي.',time:'منذ ٥ دقائق',href:'21-distributor-order-details.html?order=SA-10928',icon:'<path d="M6 4h12l1 16H5L6 4ZM9 8a3 3 0 0 0 6 0"/>'},{id:'n2',type:'inventory',title:'المخزون منخفض',text:'متبقي ٣ وحدات من حذاء رياضي أبيض.',time:'منذ ساعة',href:'22-distributor-inventory.html',tone:'warning',icon:'<path d="m4 8 8-4 8 4-8 4-8-4Z"/><path d="M4 8v8l8 4 8-4V8M12 12v8"/>'},{id:'n3',type:'orders',title:'طلب مرتجع جديد',text:'ريم خالد أرسلت طلب استرداد يحتاج قرارًا.',time:'منذ ساعتين',href:'23-distributor-returns.html',icon:'<path d="M9 7H4v5"/><path d="M4 12a8 8 0 1 0 2-5M4 12l5-5"/>'},{id:'n4',type:'finance',title:'تم تحويل التسوية',text:'تم تحويل ٨٬٦٤٨ ج.م إلى حسابك البنكي.',time:'أمس',href:'22-distributor-finance.html',tone:'success',icon:'<path d="m5 12 4 4L19 6"/><circle cx="12" cy="12" r="9"/>'}];const key='saey_merchant_read_notices_v1';let filter='all',read=new Set(JSON.parse(localStorage.getItem(key)||'[]'));function render(){const rows=seed.filter(x=>filter==='all'||filter==='unread'&&!read.has(x.id)||x.type===filter);if(!rows.length)return SaeyUI.renderState(notices,{title:'لا توجد إشعارات جديدة',message:'أنت مطّلع على كل تحديثات المتجر.'});notices.innerHTML=rows.map(n=>`<a class="notice-card ops-card ${read.has(n.id)?'':'unread'}" data-id="${n.id}" href="${n.href}"><span class="notice-icon ${n.tone||''}"><svg class="ops-svg" viewBox="0 0 24 24">${n.icon}</svg></span><div><h3>${n.title}</h3><p>${n.text}</p></div><time class="notice-time">${n.time}</time></a>`).join('');document.querySelectorAll('[data-id]').forEach(a=>a.onclick=()=>{read.add(a.dataset.id);localStorage.setItem(key,JSON.stringify([...read]))})}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});markAll.onclick=()=>{seed.forEach(x=>read.add(x.id));localStorage.setItem(key,JSON.stringify([...read]));render();SaeyUI.success('تم تحديد كل الإشعارات كمقروءة')};render();
</script><script src="notifications-api.js"></script></body></html>
