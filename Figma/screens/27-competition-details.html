<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>سعي — تفاصيل المسابقة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="competitions.css">
</head>
<body class="saey-contests">
  <div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M2 5a8 8 0 0 1 12 0M5 8a4 4 0 0 1 6 0M8 11h.01" fill="none" stroke="currentColor"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1"/></svg></div></div>
  <main class="contest-page user-contest-page">
    <header class="contest-header"><a class="contest-back" href="08-user-home.html" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div><h1>تفاصيل المسابقة</h1><p>اعرف الجائزة وجاوب على السؤال</p></div><span></span></header>
    <section class="user-contest-hero" id="userContestDetails"></section>
    <section class="competition-question-card" aria-labelledby="competitionQuestionTitle">
      <span class="competition-question-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.5 2.5 0 1 1 4.4 1.6c-.9.9-2.1 1.3-2.1 2.6M12 16.8h.01"/></svg>سؤال المسابقة</span>
      <h2 id="competitionQuestionTitle"></h2>
      <p>لا توجد إجابة نموذجية؛ اكتب رأيك بوضوح لتأكيد مشاركتك في السحب.</p>
    </section>
    <section class="answer-card user-answer-card" id="answerCard"></section>
  </main>
  <script src="user-state.js"></script>
  <script>
    const contestId=new URLSearchParams(location.search).get('id')||'contest-tech-01',contest=SaeyState.competition(contestId),details=document.getElementById('userContestDetails'),question=document.getElementById('competitionQuestionTitle'),answerCard=document.getElementById('answerCard'),fallbackImage='https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=720&q=85';
    function answerForm(value='',editing=false){answerCard.innerHTML=`<div class="answer-card-heading"><span><svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20ZM14 7l3 3"/></svg></span><div><h3>${editing?'تعديل إجابتك':'اكتب إجابتك'}</h3><p>${editing?'احفظ التعديل قبل انتهاء المسابقة.':'إجابة واحدة فقط، ويمكنك تعديلها لاحقًا.'}</p></div></div><label class="answer-field" for="contestAnswer"><span>إجابتك على السؤال</span><textarea id="contestAnswer" maxlength="180" placeholder="اكتب إجابتك هنا...">${value}</textarea><small><b id="answerLength">${value.length}</b> / ١٨٠ حرفًا</small></label><p class="contest-form-error" id="answerError" hidden></p><button id="submitAnswer" type="button">${editing?'حفظ التعديل':'تأكيد المشاركة'}</button>`;const input=document.getElementById('contestAnswer'),counter=document.getElementById('answerLength');input.addEventListener('input',()=>counter.textContent=input.value.length.toLocaleString('ar-EG'));document.getElementById('submitAnswer').addEventListener('click',saveAnswer);if(editing)setTimeout(()=>input.focus(),0)}
    function saveAnswer(){const input=document.getElementById('contestAnswer'),error=document.getElementById('answerError'),value=input.value.trim();if(value.length<3){error.textContent='اكتب إجابة من ٣ أحرف على الأقل.';error.hidden=false;input.focus();return}SaeyState.answerCompetition(contestId,value);location.reload()}
    function render(){const responses=contest.responses||[],own=responses.find(row=>row.id==='answer-current-user'),winner=responses.find(row=>row.id===contest.winnerId),ended=Boolean(winner)||contest.status==='completed';details.innerHTML=`<div class="user-contest-cover"><img src="${contest.image||fallbackImage}" alt="واجهة متجر ${contest.merchant}"><span class="user-contest-cover-shade"></span><span class="contest-status user-contest-status">${ended?'انتهت':'نشطة الآن'}</span></div><div class="user-contest-hero-body"><div class="detail-store"><span class="detail-store-logo">${contest.merchant.charAt(0)}</span><span><strong>${contest.merchant}</strong><small><svg viewBox="0 0 24 24"><path d="m8.5 12 2.3 2.3 4.7-5"/><circle cx="12" cy="12" r="9"/></svg>متجر موثّق في سعي</small></span></div><div class="user-contest-title"><small>اسم المسابقة</small><h2>${contest.title}</h2></div><div class="user-contest-prize"><span class="user-contest-prize-icon"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8H7.5a2.5 2.5 0 1 1 2.2-3.7L12 8Zm0 0h4.5a2.5 2.5 0 1 0-2.2-3.7L12 8Z"/></svg></span><span><small>الجائزة</small><strong>${contest.prize}</strong></span></div><div class="contest-deadline"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${ended?'تم إعلان الفائز':'ينتهي التقديم '+new Date(contest.endsAt).toLocaleString('ar-EG',{day:'numeric',month:'long',hour:'numeric',minute:'2-digit'})}</div></div>`;question.textContent=contest.question;if(winner){answerCard.innerHTML=`<div class="answer-success"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg><span><strong>${winner.id==='answer-current-user'?'مبروك! أنت الفائز':'انتهت المسابقة'}</strong><small>الفائز: ${winner.user}. شكرًا لكل المشاركين.</small></span></div>`;return}if(own){answerCard.innerHTML=`<div class="answer-card-heading"><span class="success-icon"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span><div><h3>تم تسجيل إجابتك</h3><p>أنت الآن ضمن المشاركين في السحب.</p></div></div><div class="saved-answer"><small>إجابتك</small><strong>${own.answer}</strong></div><button id="editAnswer" type="button">تعديل الإجابة</button>`;document.getElementById('editAnswer').addEventListener('click',()=>answerForm(own.answer,true));return}answerForm()}
    render();
  </script>
</body>
</html>
