<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>سعي — تفاصيل المتجر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="user-experience.css">
</head>
<body class="saey-store-details">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x=".75" y=".75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2 1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>
  <main class="store-details-page">
    <header class="store-details-top">
      <a class="store-details-back" href="11-featured-stores.html" aria-label="العودة للمتاجر"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <span>تفاصيل المتجر</span>
      <div class="store-details-actions">
        <button class="store-icon-button" id="report" type="button" aria-label="الإبلاغ عن المتجر"><svg viewBox="0 0 24 24"><path d="M5 21V4m0 0h11l-2 4 2 4H5"/></svg></button>
        <button class="store-icon-button" id="shareStore" type="button" aria-label="مشاركة المتجر"><svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button>
      </div>
    </header>
    <p class="store-details-state" id="storeDetailsState" role="status" aria-live="polite">جارٍ تحميل بيانات المتجر...</p>
    <div id="storeContent" hidden>
    <section class="store-hero" id="storeHero" hidden>
      <img id="storeHeroImage" src="" alt="">
      <span class="store-hero-shade"></span>
    </section>
    <section class="store-profile-card" id="storeProfile" hidden>
      <div class="store-profile-head">
        <div class="store-logo-large" id="storeLogo">س</div>
        <div class="store-profile-copy"><h1 id="storeName"></h1><p id="storeCategoryLocation"></p></div>
        <button class="store-icon-button favorite-store" id="favoriteStore" type="button" aria-label="إضافة المتجر للمفضلة"><svg viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
      </div>
      <div class="store-stats"><span><b id="storeRating">—</b><small>التقييم</small></span><span><b id="storeDistance">—</b><small>المسافة</small></span><span><b id="storeProductCount">0</b><small>منتج</small></span></div>
      <div class="store-actions"><a class="store-action primary" id="storePhone" href="#"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>اتصال</a><a class="store-action" id="storeChat" href="#"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>دردشة</a></div>
    </section>
    <section class="store-info-block" id="storeAbout" hidden><h2>عن المتجر</h2><p id="storeDescription"></p><div class="store-location"><span class="store-info-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span><b>موقع المتجر</b><small id="storeAddress"></small></span><a id="storeMap" href="#" target="_blank" rel="noreferrer" aria-label="فتح موقع المتجر في الخرائط"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a></div></section>
    <section class="store-info-block" id="storePolicySection" hidden><h2>سياسات المتجر</h2><div class="policy-summary" id="storePolicies"></div></section>
    <section class="youtube-ad-section store-active-ads-section" id="storeAdsSection" hidden>
      <div class="youtube-ad-section-head"><h2>إعلانات المتجر</h2><span>إعلانات نشطة</span></div>
      <div class="store-active-ads" id="storeAds" aria-live="polite"></div>
      <div class="store-ads-state" id="storeAdsState" role="status" aria-live="polite" hidden></div>
      <button class="store-ads-more" id="loadMoreStoreAds" type="button" hidden>تحميل إعلانات إضافية</button>
    </section>
    <div class="store-section-head"><h2>منتجات المتجر</h2></div>
    <div class="store-product-controls">
      <label class="store-product-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="storeProductSearch" type="search" placeholder="ابحث داخل المتجر" aria-label="ابحث داخل منتجات المتجر"></label>
      <select class="store-product-sort" id="storeProductSort" aria-label="ترتيب منتجات المتجر">
        <option value="high_rate">الأعلى تقييمًا</option>
        <option value="newest">المضاف حديثًا</option>
        <option value="most_purchased">الأكثر شراءً</option>
      </select>
    </div>
    <section class="store-products" id="storeProducts" aria-live="polite"></section>
    <p class="store-products-state" id="storeProductsState" role="status" aria-live="polite" hidden></p>
    <button class="store-products-more" id="loadMoreProducts" type="button" hidden>تحميل منتجات إضافية</button>
    </div>
  </main>
  <nav class="saey-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="08-user-home.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-9h6v9"/></svg></span><span>الرئيسية</span></a>
    <a class="active" href="09-categories.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>الأقسام</span></a>
    <a href="16-orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/></svg></span><span>الطلبات</span></a>
    <a href="15-account.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span>حسابي</span></a>
  </nav>
  <dialog class="product-report-dialog" id="reportDialog">
    <form id="reportForm">
      <div class="report-sheet-handle" aria-hidden="true"></div>
      <button class="report-close" id="closeReport" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <h2>الإبلاغ عن المتجر</h2>
      <p>اختر سبب البلاغ، وسيقوم فريق سعي بمراجعته.</p>
      <div id="reportReasons"></div>
      <p id="reportStatus" role="status" aria-live="polite"></p>
      <button class="report-submit" id="submitReport" type="submit" disabled>إرسال البلاغ</button>
    </form>
  </dialog>
  <script src="user-state.js"></script><script src="user-experience.js"></script><script src="user-report.js"></script>
  <script>
    const storeId = new URLSearchParams(location.search).get('store_id');
    window.saeyStoreId = storeId;
    if (storeId) SaeyUserReport.bind({ type: 'store', itemPath: 'stores', getItemId: () => storeId });
  </script>
  <script src="user-store-details.js"></script>
  <script src="sponsored-ads.js"></script>
</body>
</html>
