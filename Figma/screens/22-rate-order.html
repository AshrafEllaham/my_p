<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — تقييم المنتج</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="user-flows.css"><style>.rating-stars{display:flex;justify-content:center;gap:8px;margin:18px 0}.rating-stars button{border:0;background:transparent;color:#CBD5E1;font-size:34px;cursor:pointer}.rating-stars button.active{color:#F59E0B}.rating-text{width:100%;min-height:110px;padding:12px;border:1px solid #E1E8F1;border-radius:10px;resize:none;box-sizing:border-box;font:500 13px 'Cairo',sans-serif}</style></head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="flow-page" id="ratingForm"><header class="flow-head"><a class="flow-back" id="ratingBack" href="21-order-details.html?state=completed" aria-label="العودة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>تقييم المنتج</h1><span></span></header><section class="flow-card"><div class="flow-product"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=240&q=85" alt="المنتج"><div><strong id="ratingProduct">المنتج</strong><small id="ratingStore">المتجر</small></div></div></section><section class="flow-card"><h2 style="text-align:center">كيف كانت تجربتك؟</h2><div class="rating-stars" aria-label="اختر التقييم"><button type="button" aria-label="نجمة واحدة">★</button><button type="button" aria-label="نجمتان">★</button><button type="button" aria-label="ثلاث نجوم">★</button><button type="button" aria-label="أربع نجوم">★</button><button type="button" aria-label="خمس نجوم">★</button></div><textarea class="rating-text" id="ratingComment" placeholder="اكتب رأيك في المنتج والمتجر (اختياري)"></textarea></section><p class="flow-error" id="ratingError" hidden>اختر عدد النجوم أولًا.</p><button class="flow-primary" id="submitRating" type="button">إرسال التقييم</button></main><main class="flow-page flow-success-view" id="ratingDone" hidden><div class="flow-success-icon"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h1>شكرًا لتقييمك</h1><p>تم حفظ تقييمك ولن يظهر زر التقييم لهذا الطلب مرة أخرى.</p><a class="flow-primary" href="16-orders.html?tab=past-orders" style="display:grid;place-items:center;text-decoration:none">العودة لطلباتي</a></main><script src="user-state.js"></script><script>const params=new URLSearchParams(location.search),code=params.get('code')||'SA-1014',product=params.get('product')||'فستان نسائي أنيق',store=params.get('store')||'أزياء الشرق';ratingBack.href=`21-order-details.html?code=${code}&state=completed`;ratingProduct.textContent=product;ratingStore.textContent=store;if(SaeyState.isRated(code)){ratingForm.hidden=true;ratingDone.hidden=false;}let score=0;const stars=[...document.querySelectorAll('.rating-stars button')];stars.forEach((star,index)=>star.onclick=()=>{score=index+1;ratingError.hidden=true;stars.forEach((item,i)=>item.classList.toggle('active',i<=index));});submitRating.onclick=()=>{if(!score){ratingError.hidden=false;return;}SaeyState.saveRating(code,{score,comment:ratingComment.value.trim(),product,store});ratingForm.hidden=true;ratingDone.hidden=false;};</script></body></html>
