<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — كلمة مرور جديدة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="user-flows.css"><link rel="stylesheet" href="user-experience.css">  <script src="preview-design-mode.js"></script>
</head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="flow-page" id="resetForm"><header class="flow-head"><a class="flow-back" href="07-forgot-password.html"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>كلمة مرور جديدة</h1><span></span></header><p style="margin:-6px 0 18px;color:#64748B;font-size:12px;line-height:1.7">اكتب كلمة مرور قوية ثم أكدها لإكمال استعادة حسابك.</p><form class="flow-card" id="passwordForm"><label class="wallet-field-label" for="newPassword">كلمة المرور الجديدة</label><input class="wallet-field" id="newPassword" type="password" minlength="8" placeholder="٨ أحرف على الأقل" required><label class="wallet-field-label" for="confirmPassword" style="margin-top:12px">تأكيد كلمة المرور</label><input class="wallet-field" id="confirmPassword" type="password" placeholder="أعد كتابة كلمة المرور" required><p class="flow-error" id="passwordError" hidden></p><button class="flow-primary" type="submit" style="margin-top:16px">حفظ كلمة المرور</button></form></main><main class="flow-page flow-success-view" id="resetDone" hidden><div class="flow-success-icon"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h1>تم تغيير كلمة المرور</h1><p>يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p><a class="flow-primary" href="01-login.html" style="display:grid;place-items:center;text-decoration:none">تسجيل الدخول</a></main><script>document.getElementById('passwordForm').addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('newPassword').value,confirmation=document.getElementById('confirmPassword').value,error=document.getElementById('passwordError'),button=event.currentTarget.querySelector('button[type="submit"]'),identity=sessionStorage.getItem('saey_recovery_identity'),code=sessionStorage.getItem('saey_recovery_code');if(password.length<8||password!==confirmation){error.textContent=password.length<8?'كلمة المرور يجب أن تكون ٨ أحرف على الأقل.':'كلمتا المرور غير متطابقتين.';error.hidden=false;return;}if(!identity||!code){location.href='07-forgot-password.html';return;}error.hidden=true;button.disabled=true;button.textContent='جارٍ حفظ كلمة المرور…';const origin=location.protocol==='file:'?'http://127.0.0.1:8000':['localhost','127.0.0.1'].includes(location.hostname)?`${location.protocol}//${location.hostname}:8000`:location.origin;try{const response=await fetch(`${origin}/api/password-reset`,{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json','Accept-Language':'ar'},body:JSON.stringify({identity,code,password,password_confirmation:confirmation})});const result=await response.json();if(!response.ok){const first=Object.values(result.errors||{}).flat()[0];throw new Error(first||result.message||'تعذر تغيير كلمة المرور.');}sessionStorage.removeItem('saey_recovery_identity');sessionStorage.removeItem('saey_recovery_code');document.getElementById('resetForm').hidden=true;document.getElementById('resetDone').hidden=false;}catch(requestError){error.textContent=requestError instanceof TypeError?'تعذر الاتصال بالخادم. تحقق من تشغيل API ثم أعد المحاولة.':requestError.message;error.hidden=false;button.disabled=false;button.textContent='حفظ كلمة المرور';}});</script><script src="user-experience.js"></script></body></html>
