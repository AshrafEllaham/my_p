<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سعي — كلمة مرور جديدة</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="user-flows.css"></head><body class="saey-flow"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons">▮▮　⌁　▰</div></div><main class="flow-page" id="resetForm"><header class="flow-head"><a class="flow-back" href="07-forgot-password.html"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><h1>كلمة مرور جديدة</h1><span></span></header><p style="margin:-6px 0 18px;color:#64748B;font-size:12px;line-height:1.7">اكتب كلمة مرور قوية ثم أكدها لإكمال استعادة حسابك.</p><form class="flow-card" id="passwordForm"><label class="wallet-field-label" for="newPassword">كلمة المرور الجديدة</label><input class="wallet-field" id="newPassword" type="password" minlength="8" placeholder="٨ أحرف على الأقل" required><label class="wallet-field-label" for="confirmPassword" style="margin-top:12px">تأكيد كلمة المرور</label><input class="wallet-field" id="confirmPassword" type="password" placeholder="أعد كتابة كلمة المرور" required><p class="flow-error" id="passwordError" hidden></p><button class="flow-primary" type="submit" style="margin-top:16px">حفظ كلمة المرور</button></form></main><main class="flow-page flow-success-view" id="resetDone" hidden><div class="flow-success-icon"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></div><h1>تم تغيير كلمة المرور</h1><p>يمكنك الآن تسجيل الدخول باستخدام كلمة المرور الجديدة.</p><a class="flow-primary" href="01-login.html" style="display:grid;place-items:center;text-decoration:none">تسجيل الدخول</a></main><script>document.getElementById('passwordForm').onsubmit=event=>{event.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value,error=document.getElementById('passwordError');if(a.length<8||a!==b){error.textContent=a.length<8?'كلمة المرور يجب أن تكون ٨ أحرف على الأقل.':'كلمتا المرور غير متطابقتين.';error.hidden=false;return;}document.getElementById('resetForm').hidden=true;document.getElementById('resetDone').hidden=false;};</script></body></html>
