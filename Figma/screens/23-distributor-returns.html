<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>سعي — المرتجعات والاسترداد</title><link rel="stylesheet" href="auth.css"><link rel="stylesheet" href="uber-ui.css"><link rel="stylesheet" href="merchant-operations.css"><link rel="stylesheet" href="merchant-backoffice.css"></head>
<body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div>
<main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="21-distributor-orders.html" aria-label="العودة إلى الطلبات"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>المرتجعات والاسترداد</h1><p>متابعة الطلبات والنزاعات</p></div><span></span></header>
<section class="ops-intro"><div><h2>طلبات الإرجاع</h2><p>راجع السبب واتخذ القرار المناسب للعميل.</p></div></section>
<section class="ops-summary"><article class="ops-card"><span><i></i>بانتظار القرار</span><strong id="pendingCount">—</strong></article><article class="ops-card"><span><i></i>قيد المراجعة</span><strong id="reviewCount">—</strong></article><article class="ops-card"><span><i></i>مكتملة</span><strong id="completedCount">—</strong></article></section>
<div class="bo-filters" id="returnFilters"><button class="active" data-filter="all">الكل</button><button data-filter="pending">بانتظار القرار</button><button data-filter="review">قيد المراجعة</button><button data-filter="completed">مكتملة</button><button data-filter="rejected">مرفوضة</button></div>
<section class="bo-list" id="returnsList"></section></main>
<div class="sheet-backdrop" id="decisionSheet" aria-hidden="true"><section class="ops-sheet" role="dialog" aria-modal="true" aria-labelledby="decisionTitle"><div class="sheet-handle"></div><header class="ops-sheet-head"><h2 id="decisionTitle">معالجة طلب الإرجاع</h2><button type="button" data-close aria-label="إغلاق">×</button></header><p>حدد القرار وسيتم تحديث حالة الطلب وإشعار العميل.</p><div class="decision-box"><span>الطلب المحدد</span><strong id="decisionCode">—</strong></div><div class="mode-switch"><button class="active" data-decision="approved">قبول</button><button data-decision="review">مراجعة</button><button data-decision="rejected">رفض</button></div><label class="form-field"><span>ملاحظة القرار</span><textarea class="sheet-note" id="decisionNote" placeholder="اكتب سبب القرار أو تعليمات الإرجاع"></textarea></label><p class="sheet-error" id="decisionError"></p><button class="primary-action" id="saveDecision">حفظ وإشعار العميل</button></section></div><div class="ops-toast" id="toast"></div>
<script src="merchant-state.js"></script><script>
const money=v=>`${Number(v).toLocaleString('ar-EG')} ج.م`,labels={pending:'بانتظار القرار',review:'قيد المراجعة',approved:'مقبول',completed:'تم الاسترداد',rejected:'مرفوض'};let filter='all',selectedId='',decision='approved';
function render(){const items=SaeyMerchant.returns();pendingCount.textContent=items.filter(x=>x.status==='pending').length.toLocaleString('ar-EG');reviewCount.textContent=items.filter(x=>x.status==='review'||x.status==='approved').length.toLocaleString('ar-EG');completedCount.textContent=items.filter(x=>x.status==='completed').length.toLocaleString('ar-EG');const visible=items.filter(x=>filter==='all'||x.status===filter);returnsList.innerHTML=visible.length?visible.map(x=>`<article class="bo-card ops-card"><div class="bo-card-head"><div><strong class="bo-card-code">${x.id}</strong><time class="bo-card-time">${x.date} · الطلب ${x.order}</time></div><span class="bo-status ${x.status}">${labels[x.status]}</span></div><div class="bo-card-body"><img src="${SaeyMerchant.inventory().find(p=>p.id===x.productId)?.image||''}" alt=""><div><h3>${x.product}</h3><p>${x.customer}</p></div><strong>${money(x.amount)}</strong></div><div class="bo-reason"><svg class="ops-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 17h.01"/></svg><span><b>${x.reason}</b>${x.details}</span></div>${['pending','review','approved'].includes(x.status)?`<div class="bo-actions"><button class="bo-primary" data-open="${x.id}">اتخاذ قرار</button><a class="bo-secondary" href="14-chat-conversation.html?store=${encodeURIComponent(x.customer)}">دردشة العميل</a></div>`:''}</article>`).join(''):`<div class="empty-state ops-card"><h3>لا توجد طلبات</h3><p>لا توجد مرتجعات بهذه الحالة حاليًا.</p></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDecision(b.dataset.open))}
returnFilters.querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;returnFilters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
const sheet=decisionSheet;function openDecision(id){selectedId=id;decision='approved';decisionCode.textContent=id;decisionNote.value='';sheet.querySelectorAll('[data-decision]').forEach((x,i)=>x.classList.toggle('active',i===0));sheet.classList.add('visible');sheet.setAttribute('aria-hidden','false')}function close(){sheet.classList.remove('visible');sheet.setAttribute('aria-hidden','true')}sheet.querySelector('[data-close]').onclick=close;sheet.onclick=e=>{if(e.target===sheet)close()};sheet.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{decision=b.dataset.decision;sheet.querySelectorAll('[data-decision]').forEach(x=>x.classList.toggle('active',x===b))});saveDecision.onclick=()=>{if(decision==='rejected'&&!decisionNote.value.trim()){decisionError.textContent='اكتب سبب الرفض للعميل.';return}SaeyMerchant.updateReturn(selectedId,decision,decisionNote.value.trim());decisionError.textContent='';close();render();toast.textContent='تم تحديث طلب الإرجاع وإشعار العميل';toast.classList.add('visible');setTimeout(()=>toast.classList.remove('visible'),2200)};render();
</script></body></html>
