<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>سعي — كل العمليات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="wallet.css">
  <link rel="stylesheet" href="wallet-transactions.css">
  <link rel="stylesheet" href="uber-ui.css">
<link rel="stylesheet" href="user-experience.css"></head>
<body class="saey-wallet-transactions">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 11" width="17" height="11" fill="currentColor"><path d="M1 9a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1v-1zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-3.5zm4-2.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V4zm4-3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V10a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1V1z"/></svg>
      <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-3.8-3.3a5.5 5.5 0 0 1 7.6 0 .8.8 0 0 0 1.1-1.1 7 7 0 0 0-9.8 0 .8.8 0 0 0 1.1 1.1zm-2.2-2.2a8.5 8.5 0 0 1 12 0 .8.8 0 0 0 1.1-1.1 10 10 0 0 0-14.2 0 .8.8 0 0 0 1.1 1.1z"/></svg>
      <svg viewBox="0 0 25 12" width="24" height="11" fill="none"><rect x=".75" y=".75" width="20.5" height="10.5" rx="3.25" stroke="currentColor" stroke-width="1.2" stroke-opacity=".4"/><rect x="2.5" y="2.5" width="17" height="7" rx="1.8" fill="currentColor"/><path d="M23 4v4a1.2 1.2 0 0 0 1.2 1.2v-1.6A1.2 1.2 0 0 0 23 4z" fill="currentColor" fill-opacity=".4"/></svg>
    </div>
  </div>
  <main class="wallet-transactions-page">
    <header class="wallet-header">
      <a class="wallet-back" href="17-wallet.html" aria-label="العودة للمحفظة"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>
      <h1>كل العمليات</h1>
      <span class="wallet-header-spacer" aria-hidden="true"></span>
    </header>

    <section class="transactions-summary" aria-label="ملخص المحفظة">
      <div><span>الرصيد الحالي</span><strong id="transactionsBalance" aria-live="polite">جارٍ تحميل الرصيد...</strong></div>
      <div><span>إجمالي العمليات</span><strong id="transactionsTotal">—</strong></div>
    </section>

    <div class="wallet-section-head transactions-title"><h2>سجل العمليات</h2><span>الأحدث أولًا</span></div>
    <p class="wallet-note wallet-transactions-state" id="transactionsState" role="status">جارٍ تحميل العمليات...</p>
    <button class="wallet-transactions-retry" id="transactionsRetry" type="button" hidden>إعادة المحاولة</button>
    <section class="wallet-list wallet-transactions-list" id="walletTransactionsList" aria-label="كل عمليات المحفظة" aria-live="polite" aria-busy="true"></section>
    <nav class="wallet-pagination" id="walletPagination" aria-label="صفحات عمليات المحفظة" hidden>
      <button id="transactionsPrevious" type="button">السابق</button>
      <span id="transactionsPageLabel" aria-live="polite">صفحة 1 من 1</span>
      <button id="transactionsNext" type="button">التالي</button>
    </nav>
  </main>
  <nav class="saey-bottom-nav" aria-label="التنقل الرئيسي">
    <a href="08-user-home.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-9h6v9"/></svg></span><span>الرئيسية</span></a>
    <a href="09-categories.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span><span>الأقسام</span></a>
    <a href="16-orders.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 13 2 2 4-4"/></svg></span><span>الطلبات</span></a>
    <a class="active" href="15-account.html" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></span><span>حسابي</span></a>
  </nav>
  <script>
    const walletApiBaseOrigin = window.location.protocol === 'file:'
      ? 'http://localhost:8000'
      : ['localhost', '127.0.0.1'].includes(window.location.hostname) && window.location.port !== '8000'
        ? `${window.location.protocol}//${window.location.hostname}:8000`
        : window.location.origin;
    const walletApiBaseUrl = new URL(localStorage.getItem('saey_api_base') || '/api', walletApiBaseOrigin);
    walletApiBaseUrl.pathname = walletApiBaseUrl.pathname.replace(/\/(?:user|store)\/?$/, '').replace(/\/$/, '') || '/api';
    const walletApiRoot = walletApiBaseUrl.toString().replace(/\/$/, '');
    const walletTransactionPageSize = 10;
    const walletTransactionLabels = {
      deposit: 'شحن', purchase: 'شراء', refund: 'استرداد', transfer_in: 'تحويل وارد',
      transfer_out: 'تحويل صادر', withdrawal: 'سحب', commission: 'عمولة',
      settlement: 'تسوية', ad_payment: 'دفع إعلان',
    };
    const walletTransactionStatusLabels = {
      pending: 'معلقة', completed: 'مكتملة', failed: 'فشلت', reversed: 'معكوسة',
    };
    const transactionsList = document.getElementById('walletTransactionsList');
    const transactionsState = document.getElementById('transactionsState');
    const transactionsRetry = document.getElementById('transactionsRetry');
    const walletPagination = document.getElementById('walletPagination');
    let transactionsUrl = null;
    let currentTransactionsPage = 1;

    const walletCurrencyLabel = currency => currency === 'EGP' ? 'ج.م' : currency;
    const formatWalletMoney = (amount, currency) => `${Number(amount || 0).toLocaleString('ar-EG')} ${walletCurrencyLabel(currency || 'EGP')}`;
    const showTransactionsState = (message, hasError = false) => {
      transactionsState.textContent = message;
      transactionsState.hidden = !message;
      transactionsRetry.hidden = !hasError;
    };
    const walletApiRequest = async url => {
      const token = localStorage.getItem('saey_api_token') || '';
      if (!token) throw new Error('سجّل الدخول لعرض عمليات المحفظة.');

      let response;
      try {
        response = await fetch(url, {
          headers: {
            Accept: 'application/json',
            'Accept-Language': document.documentElement.lang || 'ar',
            Authorization: `Bearer ${token}`,
          },
        });
      } catch (error) {
        throw new Error('تعذر الاتصال بالخادم. تحقق من الاتصال ثم أعد المحاولة.');
      }

      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.message || 'تعذر تحميل عمليات المحفظة.');
      return payload;
    };
    const renderTransaction = transaction => {
      const item = document.createElement('article');
      const isCredit = Number(transaction.balance_after) >= Number(transaction.balance_before);
      const tone = transaction.status === 'pending'
        ? 'transaction-pending'
        : ['failed', 'reversed'].includes(transaction.status)
          ? 'transaction-rejected'
          : transaction.type === 'purchase'
            ? 'transaction-purchase'
            : isCredit ? 'transaction-credit' : 'transaction-approved';
      const sign = isCredit ? '+' : '−';
      item.className = `wallet-transaction ${tone}`;

      const main = document.createElement('div');
      main.className = 'wallet-transaction-main';
      const title = document.createElement('strong');
      title.textContent = walletTransactionLabels[transaction.type] || 'عملية محفظة';
      const amount = document.createElement('b');
      amount.textContent = `${sign}${formatWalletMoney(transaction.amount, transaction.currency)}`;
      main.append(title, amount);

      const meta = document.createElement('div');
      meta.className = 'wallet-transaction-meta';
      const status = document.createElement('small');
      status.textContent = walletTransactionStatusLabels[transaction.status] || transaction.status;
      const time = document.createElement('time');
      time.dateTime = transaction.created_at || '';
      time.textContent = transaction.created_at
        ? new Date(transaction.created_at).toLocaleString('ar-EG')
        : '—';
      meta.append(status, time);
      item.append(main, meta);
      return item;
    };
    const loadTransactionsPage = async (page = 1) => {
      if (!transactionsUrl) return;
      currentTransactionsPage = page;
      transactionsList.replaceChildren();
      transactionsList.setAttribute('aria-busy', 'true');
      walletPagination.hidden = true;
      showTransactionsState('جارٍ تحميل العمليات...');

      const requestUrl = new URL(transactionsUrl, walletApiRoot);
      requestUrl.searchParams.set('page', String(page));
      requestUrl.searchParams.set('limit_per_page', String(walletTransactionPageSize));
      try {
        const result = await walletApiRequest(requestUrl.toString());
        const transactions = Array.isArray(result.data) ? result.data : [];
        const visibleTransactions = transactions.filter(transaction => transaction.type !== 'earning');
        visibleTransactions.forEach(transaction => transactionsList.append(renderTransaction(transaction)));
        transactionsList.setAttribute('aria-busy', 'false');
        document.getElementById('transactionsTotal').textContent = Number(result.total || 0).toLocaleString('ar-EG');
        currentTransactionsPage = Number(result.current_page || page);
        const lastPage = Number(result.last_page || 1);
        document.getElementById('transactionsPageLabel').textContent = `صفحة ${currentTransactionsPage} من ${lastPage}`;
        document.getElementById('transactionsPrevious').disabled = currentTransactionsPage <= 1;
        document.getElementById('transactionsNext').disabled = currentTransactionsPage >= lastPage;
        walletPagination.hidden = lastPage <= 1;

        if (visibleTransactions.length === 0) {
          showTransactionsState('لا توجد عمليات مسجلة في هذه الصفحة.');
          return;
        }

        showTransactionsState('');
      } catch (error) {
        transactionsList.setAttribute('aria-busy', 'false');
        showTransactionsState(error.message, true);
      }
    };
    const loadWalletTransactions = async () => {
      showTransactionsState('جارٍ تحميل الرصيد والعمليات...');
      try {
        const walletResult = await walletApiRequest(`${walletApiRoot}/wallet`);
        const wallet = walletResult.wallet || walletResult.data?.wallet || {};
        document.getElementById('transactionsBalance').textContent = formatWalletMoney(wallet.balance, wallet.currency);
        transactionsUrl = wallet.transactions_url || `${walletApiRoot}/wallet`;
        if (!transactionsUrl) throw new Error('رابط عمليات المحفظة غير متاح.');
        await loadTransactionsPage(currentTransactionsPage);
      } catch (error) {
        document.getElementById('transactionsBalance').textContent = 'غير متاح';
        transactionsList.setAttribute('aria-busy', 'false');
        showTransactionsState(error.message, true);
      }
    };

    document.getElementById('transactionsPrevious').addEventListener('click', () => {
      if (currentTransactionsPage > 1) loadTransactionsPage(currentTransactionsPage - 1);
    });
    document.getElementById('transactionsNext').addEventListener('click', () => loadTransactionsPage(currentTransactionsPage + 1));
    transactionsRetry.addEventListener('click', loadWalletTransactions);
    loadWalletTransactions();
    window.addEventListener('focus', loadWalletTransactions);
  </script>
<script src="user-experience.js"></script></body>
</html>
