<body class="merchant-ops"><div class="status-bar"><span class="status-time">9:41</span><div class="status-icons"><svg viewBox="0 0 17 11" width="17"><path d="M1 9h3v2H1zm4-3h3v5H5zm4-3h3v8H9zm4-3h3v11h-3z"/></svg><svg viewBox="0 0 16 12" width="16"><path d="M8 10a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M2 5a8.5 8.5 0 0 1 12 0l-1.1 1.1a7 7 0 0 0-9.8 0z"/></svg><svg viewBox="0 0 25 12" width="24"><rect x="1" y="1" width="20" height="10" rx="3" fill="none" stroke="currentColor"/><rect x="3" y="3" width="16" height="6" rx="1.5"/></svg></div></div>
<main class="ops-page backoffice-page"><header class="ops-header"><a class="ops-icon-button" href="20-distributor-account.html" aria-label="العودة للحساب"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><div class="ops-header-title"><h1>سياسات المتجر</h1><p>إعدادات واضحة تظهر للعملاء</p></div><span></span></header><section class="policy-card ops-card"><header class="policy-card-head"><span class="policy-icon"><svg class="ops-svg" viewBox="0 0 24 24"><path d="M9 7H4v5"/><path d="M4 12a8 8 0 1 0 2-5M4 12l5-5"/></svg></span><div><h2>الاستبدال والاسترجاع</h2><p>حدد المهلة والشروط قبل الشراء.</p></div></header><label class="form-field"><span>مدة طلب الاسترجاع</span><select id="returnDays"><option value="7">خلال ٧ أيام</option><option value="14">خلال ١٤ يومًا</option><option value="30">خلال ٣٠ يومًا</option></select></label><label class="form-field"><span>شروط الاسترجاع</span><textarea id="returnTerms">يجب أن يكون المنتج بحالته الأصلية وغير مستخدم، مع الاحتفاظ بالتغليف.</textarea></label><div class="setting-line"><div><h3>السماح بالاستبدال</h3><p>يمكن للعميل طلب منتج بديل.</p></div><button class="switch active" id="exchangeToggle" aria-label="السماح بالاستبدال"></button></div></section><section class="policy-card ops-card"><header class="policy-card-head"><span class="policy-icon"><svg class="ops-svg" viewBox="0 0 24 24"><path d="M4 10v10h16V10M3 10l2-6h14l2 6"/><path d="M8 20v-6h8v6"/></svg></span><div><h2>الاستلام من المتجر</h2><p>نظم مدة الحجز وتعليمات الاستلام.</p></div></header><label class="form-field"><span>مدة حجز الطلب</span><select id="pickupHours"><option value="24">٢٤ ساعة</option><option value="48">٤٨ ساعة</option><option value="72">٧٢ ساعة</option></select></label><label class="form-field"><span>تعليمات الاستلام</span><textarea id="pickupTerms">يرجى إظهار رقم الطلب عند الوصول إلى المتجر.</textarea></label></section><div class="sticky-save"><button class="primary-action" id="savePolicies">حفظ السياسات</button></div></main>
<script src="merchant-state.js"></script><script src="merchant-ui-states.js"></script><script>
const key='saey_merchant_policies_v1',saved=JSON.parse(localStorage.getItem(key)||'null');let exchange=saved?saved.exchange:true;if(saved){returnDays.value=saved.returnDays;returnTerms.value=saved.returnTerms;pickupHours.value=saved.pickupHours;pickupTerms.value=saved.pickupTerms}exchangeToggle.classList.toggle('active',exchange);exchangeToggle.onclick=()=>{exchange=!exchange;exchangeToggle.classList.toggle('active',exchange)};savePolicies.onclick=()=>{localStorage.setItem(key,JSON.stringify({returnDays:returnDays.value,returnTerms:returnTerms.value.trim(),exchange,pickupHours:pickupHours.value,pickupTerms:pickupTerms.value.trim()}));SaeyMerchant.addActivity({type:'team',title:'تم تحديث سياسات المتجر',detail:'سياسات الاسترجاع والاستلام'});SaeyUI.success('تم حفظ سياسات المتجر')};
</script></body></html>
